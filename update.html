<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="nova.css">
<style>
  /* Surge 3.1 update card, Maison: a paper (or ink) card with one hairline and one modest shadow. On the left the Surge
     mark sits in a ring that fills with the download; on the right a serif headline, the version line, a three-step
     track (Download, Verify, Restart) that shows exactly where the update is, what is new, and the buttons. The restart
     is a little sequence of its own (closing, swapping in, opening again), so it never looks frozen.
     Only transform and opacity animate; the only loop is the spinner of the step that is working. */
  html,body{height:auto;overflow:hidden}
  body{padding:10px 14px 28px}
  .card{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:0;padding:0;border-radius:22px;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
  .rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0 18px;border-right:1px solid var(--m-line);-webkit-app-region:drag}
  .mark{position:relative;width:68px;height:68px}
  .mark svg.ring{position:absolute;inset:0;width:68px;height:68px;transform:rotate(-90deg)}
  .mark .ring circle{fill:none;stroke-width:3}
  .mark .ring .bg{stroke:var(--m-line)} .mark .ring .fg{stroke:var(--m-acc);stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:calc(201 - 201 * var(--p,0) / 100);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
  .mark .app{position:absolute;inset:9px;border-radius:15px;display:grid;place-items:center;background:var(--m-solid);color:var(--m-on-solid)}
  .mark .app svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .mark .chk{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--m-acc);color:#fff;box-shadow:0 0 0 3px var(--m-card);opacity:0;transform:scale(.4);transition:transform .5s var(--jelly),opacity .2s}
  .mark .chk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .ready .mark .chk,.updated .mark .chk,.installing .mark .chk{opacity:1;transform:none}
  .rail .vv{font:400 34px/1 var(--m-serif);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--m-fg)}
  .rail .vl{font:600 9.5px/1 var(--m-font);letter-spacing:.16em;text-transform:uppercase;color:var(--m-fg3)}
  .rail .ver{margin-top:auto;display:inline-flex;align-items:center;gap:5px;font:550 10.5px/1 var(--m-font);color:var(--m-fg3)}
  .rail .ver svg{width:12px;height:12px;fill:none;stroke:var(--m-acc-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .side{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px 20px;min-width:0}
  .top{display:flex;align-items:center;gap:8px;-webkit-app-region:drag}
  .eye{flex:1;display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--m-font);letter-spacing:.14em;text-transform:uppercase;color:var(--m-fg3)}
  .eye i{width:6px;height:6px;border-radius:50%;background:var(--m-acc)}
  .error .eye i{background:var(--amber)}
  .btn.x{width:28px;height:28px;padding:0!important;border-radius:8px!important;-webkit-app-region:no-drag;box-shadow:none!important;background:transparent!important}
  .x svg{width:12px;height:12px}
  h1{margin:0;font:400 30px/1.05 var(--m-serif);letter-spacing:-.01em;color:var(--m-fg)}
  h1 em{font-style:italic}
  #sub{margin:-4px 0 0;font:450 12.5px/1.45 var(--m-font);color:var(--m-fg2)}
  /* the version line: from, a thin bar, to */
  .line{display:flex;align-items:center;gap:10px;font:550 12px/1 var(--m-font);font-variant-numeric:tabular-nums;color:var(--m-fg2)}
  .line .t{position:relative;flex:1;height:4px;border-radius:4px;background:var(--m-bg3);overflow:hidden}
  .line .t i{position:absolute;inset:0;border-radius:inherit;background:var(--m-acc);transform-origin:0 50%;transform:scaleX(var(--f,0));transition:transform .7s cubic-bezier(.2,.8,.2,1)}
  .line b{color:var(--m-fg);font-weight:650}
  .meta{display:flex;justify-content:space-between;gap:10px;font:450 11.5px/1 var(--m-font);color:var(--m-fg3);font-variant-numeric:tabular-nums;min-height:12px;margin-top:-3px}
  .meta b{color:var(--m-fg);font-weight:600}
  /* the three-step track */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .st{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:10px;font:550 11.5px/1 var(--m-font);color:var(--m-fg3);background:var(--m-bg);box-shadow:inset 0 0 0 1px var(--m-line);transition:color .3s}
  .st .d{position:relative;width:14px;height:14px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--m-line2);display:grid;place-items:center}
  .st .d svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:transform .45s var(--jelly),opacity .2s}
  .st.done{color:var(--m-fg)} .st.done .d{background:var(--m-acc);box-shadow:none} .st.done .d svg{opacity:1;transform:none}
  .st.now{color:var(--m-fg);box-shadow:inset 0 0 0 1px var(--m-acc)}
  .st.now .d{box-shadow:inset 0 0 0 1.5px var(--m-line2)}
  .st.now .d::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--m-acc-ink);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .notes{display:none;padding:10px 12px;border-radius:12px;background:var(--m-bg);box-shadow:inset 0 0 0 1px var(--m-line)}
  .notes.show{display:block}
  .nh{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font:600 10px/1 var(--m-font);letter-spacing:.14em;text-transform:uppercase;color:var(--m-fg3)}
  .nh span{letter-spacing:0;text-transform:none;font:550 10.5px/1 var(--m-font);color:var(--m-acc-ink)}
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  li{display:flex;align-items:baseline;gap:9px;font:450 12px/1.4 var(--m-font);color:var(--m-fg);opacity:0;transform:translateY(4px);animation:liIn .4s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.12s + var(--i)*60ms)}
  @keyframes liIn{to{opacity:1;transform:none}}
  li.more span{color:var(--m-fg3)}
  li b{flex:none;min-width:16px;font:400 15px/1 var(--m-serif);color:var(--m-acc-ink);font-variant-numeric:tabular-nums}
  .msg{display:none;font:450 12.5px/1.45 var(--m-font);color:var(--m-fg2)}
  .msg.show{display:block}
  .row{display:flex;align-items:center;gap:8px;margin-top:2px}
  .row .grow{flex:1}
  .row .lnk{padding:8px 4px}
  .keys{font:450 10.5px/1 var(--m-font);color:var(--m-fg3);display:flex;gap:5px;align-items:center}
  .keys kbd{min-width:16px;height:17px;font-size:10px}
  /* Update now answers the instant you press it: it gives under your finger and says Starting with a spinner */
  #go{min-width:118px}
  #go.going{pointer-events:none;animation:go303 .5s var(--jelly) both}
  #go .sp{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;animation:spin .7s linear infinite}
  @keyframes go303{0%{transform:scale(1)}30%{transform:scale(.94,.9)}65%{transform:scale(1.03,1.04)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.card,li,#go.going{animation:none!important;opacity:1;transform:none}}
</style>
<script src="nova.js"></script>
<link rel="stylesheet" href="maison.css">
</head><body>
<div class="card surface" id="card">
  <div class="rail">
    <div class="mark"><svg class="ring" viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="32"/><circle class="fg" id="ring" cx="34" cy="34" r="32"/></svg><div class="app" id="tile"></div><i class="chk" id="chk"></i></div>
    <span class="vl">Surge</span><div class="vv" id="bigv">3.1</div>
    <span class="ver" id="verified"></span>
  </div>
  <div class="side">
    <div class="top"><span class="eye"><i></i><b id="eye">Software update</b></span><button class="btn icon x" id="x" title="Close (Esc)"></button></div>
    <h1 id="title">Update Surge</h1><p id="sub"></p>
    <div class="line" id="tube"><span id="from"></span><div class="t"><i id="fill"></i></div><b id="to"></b></div>
    <div class="meta" id="metaRow"><span id="m1"></span><span id="m2"></span></div>
    <div class="steps" id="steps"><div class="st" data-s="0"><i class="d"></i>Download</div><div class="st" data-s="1"><i class="d"></i>Verify</div><div class="st" data-s="2"><i class="d"></i><span id="s3">Restart</span></div></div>
    <div class="notes" id="notes"><div class="nh" id="nh">What is new</div><ol id="news"></ol></div>
    <div class="msg" id="msg"></div>
    <div class="row"><button class="btn" id="later">Later</button><button class="lnk fl" id="skip">Skip this version</button><div class="grow"></div><span class="keys" id="keys"><kbd>Return</kbd></span><button class="btn pri lg" id="go">Update now</button></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), api=window.surge, N=window.Nova;
const fmt=b=>(b/1048576).toFixed(1)+' MB', secs=s=>s>=60?Math.round(s/60)+' min':Math.max(1,s)+' s';
$('#x').innerHTML=N.ic('x'); $('#tile').innerHTML=N.ic('bolt'); $('#chk').innerHTML=N.ic('check'); $('#verified').innerHTML=N.ic('shield')+'Verified';
document.querySelectorAll('.st .d').forEach(d=>d.innerHTML=N.ic('check'));
let U={}, restartT=[];
function paint(u){ U=u||{}; const st=U.status||'idle', L=String(U.latest||'').replace(/^v/,''), C=U.current||'', c=$('#card');
  c.className='card surface '+st;
  const V=(st==='updated'||st==='uptodate'||!L)?C:L; $('#bigv').textContent=V.split('.').slice(0,2).join('.');
  const T={ available:['New version',`Surge <em>${N.esc(L)}</em> is here`,'It downloads in the background. You choose when to restart.'], checking:['Software update','Checking for updates','One moment.'],
    downloading:['Downloading',`Getting Surge <em>${N.esc(L)}</em>`,'Keep working, it all happens in the background.'], unpacking:['Almost there',`Checking Surge <em>${N.esc(L)}</em>`,'Making sure the download is complete and signed.'],
    ready:['Ready to install',`Surge <em>${N.esc(L)}</em> is ready`,'Restart now. It takes about 3 seconds and your settings stay exactly as they are.'], installing:['Restarting','See you in a moment','Closing Surge.'],
    error:['Update paused','Not this time',''], uptodate:['All good','Surge is up to date',''], updated:["You're on the new version",`Welcome to Surge <em>${N.esc(C)}</em>`,'Here is what changed.'] }[st]||['Software update','Update Surge',''];
  $('#eye').textContent=T[0]; $('#title').innerHTML=T[1]; $('#sub').textContent=T[2]; $('#sub').style.display=T[2]?'':'none';
  const flow=['available','downloading','unpacking','ready','installing'].includes(st)&&L&&L!==C;
  $('#tube').style.display=flow?'':'none'; $('#steps').style.display=flow&&st!=='available'?'':'none'; $('#from').textContent=C; $('#to').textContent=L;
  const p=st==='downloading'?(U.progress||0):['unpacking','ready','installing'].includes(st)?100:0; $('#fill').style.setProperty('--f',p/100); $('#ring').style.setProperty('--p',p);
  // the track: which step is done, which one is working now
  const at={downloading:0,unpacking:1,ready:2,installing:2}[st]; document.querySelectorAll('.st').forEach(s=>{ const i=+s.dataset.s; s.classList.toggle('done',at!=null&&(i<at||(st==='installing'&&i<2))); s.classList.toggle('now',at!=null&&i===at&&st!=='ready'); });
  $('#s3').textContent=st==='installing'?'Restarting':'Restart';
  restartT.forEach(clearTimeout); restartT=[];
  if(st==='installing'){ const say=(t,ms)=>restartT.push(setTimeout(()=>{ if(U.status==='installing') $('#sub').textContent=t; },ms)); say(`Swapping in ${L}.`,900); say('Opening Surge again.',2000); }
  $('#m1').innerHTML=st==='downloading'&&U.size?`<b>${fmt(U.bytes||0)}</b> of ${fmt(U.size)}, ${p}%`:st==='downloading'?`${p}%`:'';
  $('#m2').innerHTML=st==='downloading'&&U.speed?`${fmt(U.speed)}/s${U.eta?', about <b>'+secs(U.eta)+'</b> left':''}`:''; $('#metaRow').style.display=st==='downloading'?'':'none';
  const msg=st==='error'?(U.error||'Surge will try again on its own.'):st==='uptodate'?(U.noBuild?'Updates for Intel Macs come from the website.':'You have the newest Surge. It checks again on its own.'):''; $('#msg').textContent=msg; $('#msg').classList.toggle('show',!!msg);
  const news=(st==='available'||st==='ready'||st==='updated')&&U.whatsNew?.length; $('#notes').classList.toggle('show',!!news);
  if(news){ $('#nh').innerHTML=`What is new in ${N.esc(st==='updated'?C:L)} <span>${U.whatsNew.length} change${U.whatsNew.length===1?'':'s'}</span>`; const top=U.whatsNew.slice(0,4), more=U.whatsNew.length-top.length; $('#news').innerHTML=top.map((t,i)=>`<li style="--i:${i}"><b>${i+1}</b><span>${N.esc(t)}</span></li>`).join('')+(more>0?`<li class="more" style="--i:4"><b></b><span>and ${more} more in the What's new film</span></li>`:''); }
  $('#verified').style.visibility=['ready','installing','updated','unpacking'].includes(st)?'visible':'hidden';
  const b=$('#go'); b.disabled=false;
  if(st==='ready') b.textContent='Restart now'; else if(st==='downloading') b.textContent='Cancel'; else if(st==='error') b.textContent='Try again';
  else if(st==='checking'||st==='installing'||st==='unpacking'){ b.innerHTML=`<i class="sp"></i>${st==='installing'?'Restarting':st==='unpacking'?'Verifying':'Checking'}`; b.disabled=true; } else if(st==='updated'||st==='uptodate') b.textContent='Done'; else b.textContent='Update now';
  b.classList.toggle('pri',!(st==='downloading'||st==='unpacking'));
  $('#keys').style.display=b.disabled||st==='downloading'?'none':'';
  $('#skip').style.display=(st==='available'||st==='ready')?'':'none'; $('#later').style.display=['updated','uptodate','installing','checking'].includes(st)?'none':'';
  requestAnimationFrame(()=>api?.updHeight?.(Math.ceil($('#card').offsetHeight+40))); }
// never a dead button: the press shows at once; the next state from Surge repaints it, and if nothing answers within 10 s
// the button comes back as it was
let goT=0;
function pressed(){ const b=$('#go'); b.classList.add('going'); b.innerHTML='<i class="sp"></i>Starting'; clearTimeout(goT); goT=setTimeout(()=>{ b.classList.remove('going'); paint(U); },10000); }
const _paint=paint; paint=function(u){ if(u&&u.status!==U.status){ clearTimeout(goT); $('#go').classList.remove('going'); } _paint(u); };
$('#go').onclick=()=>{ const st=U.status; if(!['ready','downloading','unpacking','checking','installing','updated','uptodate'].includes(st)) pressed(); if(st==='ready') api?.action('updater','install'); else if(st==='downloading') api?.action('updater','cancel'); else if(st==='unpacking'||st==='checking'||st==='installing') return; else if(st==='error') api?.action('updater','check'); else if(st==='updated'||st==='uptodate') api?.action('updater','close'); else api?.action('updater','download'); };
$('#later').onclick=()=>api?.action('updater','later'); $('#skip').onclick=()=>api?.action('updater','skip');
$('#x').onclick=()=>api?.action('updater',U.status==='updated'||U.status==='uptodate'?'close':'later');
// keyboard: Return does the main thing, Escape closes
addEventListener('keydown',e=>{ if(e.key==='Escape') $('#x').click(); else if(e.key==='Enter'&&!$('#go').disabled&&U.status!=='downloading') $('#go').click(); });
(async()=>{ paint(await api?.action('updater','state')||{}); api?.on('updater:state',paint); })();
</script></body></html>
