<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="nova.css">
<style>
  html,body{height:auto;overflow:hidden}
  body{padding:10px 12px 26px}
  .card{position:relative;border-radius:30px;padding:9px;isolation:isolate;overflow:hidden;
    background:radial-gradient(100% 50% at 0% 0%,rgba(25,214,154,.14),transparent 70%),linear-gradient(180deg,#141027,#08060f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08),0 26px 50px -22px rgba(0,0,0,.95),0 18px 50px -26px var(--hc);animation:nv-pop .7s var(--jelly) both}
  .hero{padding:16px 16px 16px 16px;gap:14px;border-radius:24px}
  .hero .tile{--ts:54px}
  .hero h1{font-size:27px}
  .ver{display:inline-flex;align-items:center;gap:7px;margin-top:3px;align-self:flex-start;padding:5px 10px;border-radius:999px;font:800 11.5px/1 var(--head);font-variant-numeric:tabular-nums;background:rgba(0,0,30,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .ver svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:10px;background:rgba(0,0,30,.25)}
  .x svg{width:13px;height:13px}
  .body{padding:14px 10px 4px}
  .prog{display:none;align-items:flex-end;gap:14px}
  .prog.show{display:flex}
  .pct{font:800 38px/.9 var(--head);letter-spacing:-.05em;font-variant-numeric:tabular-nums;min-width:96px}
  .pct small{font-size:18px;letter-spacing:-.02em;opacity:.6}
  .pw{flex:1;min-width:0}
  .bar{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);overflow:hidden}
  .bar i{position:absolute;inset:0;border-radius:inherit;transform-origin:0 50%;transform:scaleX(var(--f,0));transition:transform .7s var(--out);
    background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),linear-gradient(90deg,var(--hc),var(--hc2));box-shadow:0 0 14px -2px var(--hc)}
  .bar.stripe i{transform:none;background:repeating-linear-gradient(115deg,color-mix(in oklab,var(--hc) 70%,transparent) 0 10px,color-mix(in oklab,var(--hc2) 50%,transparent) 10px 20px);opacity:.7}
  .meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font:650 11.5px/1 var(--body);color:var(--mut);font-variant-numeric:tabular-nums}
  .meta b{color:var(--tx2);font-weight:750}
  ul{display:none;list-style:none;margin:2px 0 0;padding:0;gap:7px;flex-direction:column}
  ul.show{display:flex}
  li{display:flex;align-items:center;gap:10px;font:650 12.5px/1.3 var(--body);color:var(--tx2)}
  li .tile{--ts:24px;border-radius:8px}
  li .tile svg{stroke-width:2.6}
  .msg{display:none;font:650 12.5px/1.4 var(--body);color:var(--tx2)}
  .msg.show{display:block}
  .row{display:flex;align-items:center;gap:6px;padding:14px 4px 2px}
  .row .grow{flex:1}
  .card.busy .hero .tile{animation:nv-tile .9s var(--jelly) both}
</style>
<script src="nova.js"></script>
</head><body>
<div class="card h-mint" id="card">
  <div class="hero h-mint drag" id="hero">
    <div class="wm" id="wm"></div>
    <div class="tile" id="tile"></div>
    <div class="htx"><span class="eyebrow" id="eye">Surge update</span><h1 id="title">Update Surge</h1><span class="ver" id="ver"></span></div>
    <button class="btn icon x" id="x" title="Close"></button>
  </div>
  <div class="body">
    <div class="prog" id="prog"><div class="pct" id="pct">0<small>%</small></div><div class="pw"><div class="bar" id="bar"><i id="fill"></i></div><div class="meta"><span id="m1"></span><span id="m2"></span></div></div></div>
    <div class="msg" id="msg"></div>
    <ul id="news"></ul>
    <div class="row"><button class="lnk" id="skip">Skip this version</button><button class="lnk" id="later">Later</button><div class="grow"></div><button class="btn pri lg" id="go">Update now</button></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), api=window.surge, N=window.Nova;
const fmt=b=>(b/1048576).toFixed(1)+' MB', secs=s=>s>=60?Math.round(s/60)+' min':Math.max(1,s)+' s';
$('#x').innerHTML=N.ic('x'); $('#wm').innerHTML=N.ic('refresh');
let U={}, last='';
function paint(u){ U=u||{}; const st=U.status||'idle', L=String(U.latest||'').replace(/^v/,''), c=$('#card'), h=$('#hero');
  const hue=st==='error'?'h-amber':st==='ready'||st==='installing'?'h-pink':st==='updated'?'h-violet':'h-mint';
  for(const el of [c,h]){ el.classList.remove('h-mint','h-amber','h-pink','h-violet'); el.classList.add(hue); }
  c.classList.toggle('busy',st!==last&&['ready','installing','updated'].includes(st)); last=st;
  $('#ver').innerHTML=L&&st!=='updated'&&L!==U.current?`${N.esc(U.current)} ${N.ic('play')} ${N.esc(L)}`:`Version ${N.esc(U.current||L)}`;
  const T={ available:['New version',`Surge ${L} is here`], checking:['Surge update','Checking GitHub'], downloading:['Downloading',`Getting Surge ${L}`],
    unpacking:['Almost there',`Checking Surge ${L}`], ready:['Ready when you are',`Surge ${L} is ready`], installing:['Hold tight','Restarting Surge'],
    error:['Update paused','Not this time'], uptodate:['All good','Surge is up to date'], updated:["You're on the new version",`Welcome to Surge ${L}`] }[st]||['Surge update','Update Surge'];
  $('#eye').textContent=T[0]; $('#title').textContent=T[1];
  $('#tile').innerHTML=N.ic(st==='ready'||st==='installing'?'rocket':st==='error'?'refresh':st==='updated'||st==='uptodate'?'check':'down');
  $('#wm').innerHTML=N.ic(st==='ready'||st==='installing'?'rocket':st==='updated'?'spark':'refresh');
  const prog=['downloading','unpacking','checking'].includes(st); $('#prog').classList.toggle('show',prog);
  const p=st==='downloading'?(U.progress||0):st==='unpacking'?100:0; $('#pct').innerHTML=st==='checking'?'<small>...</small>':`${p}<small>%</small>`; $('#fill').style.setProperty('--f',p/100);
  $('#bar').classList.toggle('stripe',st==='checking'||(st==='downloading'&&!U.size));
  $('#m1').innerHTML=st==='downloading'&&U.size?`<b>${fmt(U.bytes||0)}</b> of ${fmt(U.size)}`:st==='unpacking'?'Verifying the download':st==='checking'?'One moment':'';
  $('#m2').innerHTML=st==='downloading'&&U.speed?`${fmt(U.speed)}/s${U.eta?', about <b>'+secs(U.eta)+'</b> left':''}`:'';
  const msg=st==='error'?(U.error||'Surge will try again on its own.'):st==='ready'?'Surge closes and reopens in about 3 seconds. Your settings stay exactly as they are.':st==='installing'?'Swapping in the new version. Surge will be back in the menu bar in a moment.':st==='uptodate'?(U.noBuild?'Updates for Intel Macs come from the website.':'You have the newest Surge. It checks again on its own.'):'';
  $('#msg').textContent=msg; $('#msg').classList.toggle('show',!!msg);
  const news=(st==='available'||st==='updated')&&U.whatsNew?.length; $('#news').classList.toggle('show',!!news);
  if(news) $('#news').innerHTML=U.whatsNew.map(t=>`<li><div class="tile ${['h-pink','h-violet','h-cyan'][U.whatsNew.indexOf(t)%3]}">${N.ic('check')}</div>${N.esc(t)}</li>`).join('');
  const b=$('#go'); b.disabled=false; b.style.display='';
  if(st==='ready') b.textContent='Restart and update'; else if(st==='downloading'||st==='unpacking') b.textContent='Cancel'; else if(st==='error') b.textContent='Try again';
  else if(st==='checking'||st==='installing'){ b.textContent=st==='installing'?'Restarting':'Checking'; b.disabled=true; } else if(st==='updated'||st==='uptodate') b.textContent='Nice'; else b.textContent='Update now';
  b.classList.toggle('pri',!(st==='downloading'||st==='unpacking'));
  $('#skip').style.visibility=(st==='available'||st==='ready')?'visible':'hidden'; $('#later').style.visibility=['updated','uptodate','installing'].includes(st)?'hidden':'visible';
  requestAnimationFrame(()=>api?.updHeight?.(Math.ceil($('#card').offsetHeight+36))); }
$('#go').onclick=()=>{ const st=U.status; if(st==='ready') api?.action('updater','install'); else if(st==='downloading'||st==='unpacking') api?.action('updater','cancel'); else if(st==='error') api?.action('updater','check'); else if(st==='updated'||st==='uptodate') api?.action('updater','close'); else api?.action('updater','download'); };
$('#later').onclick=()=>api?.action('updater','later'); $('#skip').onclick=()=>api?.action('updater','skip'); $('#x').onclick=()=>api?.action(U.status==='updated'||U.status==='uptodate'?'updater':'updater',U.status==='updated'||U.status==='uptodate'?'close':'later');
addEventListener('keydown',e=>{ if(e.key==='Escape') $('#x').click(); });
(async()=>{ paint(await api?.action('updater','state')||{}); api?.on('updater:state',paint); })();
</script></body></html>
