<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Surge</title>
<style>
  :root{ --bg:rgba(12,12,18,.9); --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.08); --text:#f2f2f6; --muted:#9a9aa6; --accent:#00FF85; --accent2:#39FF14;
    --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;color:var(--text);font:14px/1.45 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none}
  .win{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:100%;background:var(--bg);border-radius:14px;overflow:hidden;position:relative;animation:pop .6s var(--spring) both}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}}
  .drag{-webkit-app-region:drag}
  .aura{position:absolute;inset:-40%;pointer-events:none;filter:blur(110px);opacity:.12;z-index:0;background:conic-gradient(from 0deg,var(--accent),var(--accent2),#7A5CFF,var(--accent));animation:spin 28s linear infinite;mix-blend-mode:screen}
  @keyframes spin{to{transform:rotate(1turn)}}
  .win>.aura{position:absolute} .win>aside,.win>main{position:relative;z-index:1;min-width:0;min-height:0}
  aside{padding:52px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.18);overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 14px;font-weight:700}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px var(--accent);display:grid;place-items:center}
  .brand .dot svg{width:12px;fill:#06110a}
  .grp{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px;font-weight:600}
  nav{display:flex;flex-direction:column;gap:1px;position:relative}
  nav button{all:unset;height:32px;padding:0 10px;border-radius:9px;color:var(--muted);display:flex;align-items:center;gap:9px;cursor:pointer;transition:color .25s,background .25s,transform .25s var(--spring);font-size:13px}
  nav button:hover{transform:translateX(3px);background:rgba(255,255,255,.05)} nav button.on{color:var(--text);background:rgba(255,255,255,.1)}
  nav button .ic{width:16px;height:16px;flex:none;display:grid;place-items:center}
  nav button .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav button .led{margin-left:auto;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15)} nav button.live .led{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  aside .spacer{flex:1}
  nav button,.status,.vol{-webkit-app-region:no-drag}
  .status{padding:9px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:10px}
  .status b{color:var(--text)} .status .led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
  .vol{padding:10px 11px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-top:8px}
  .vol .vt{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px} .vol .vt span:last-child{cursor:pointer;font-size:13px} .vol.muted .vt span:last-child{opacity:.5}
  .vol input{width:100%}
  .wl{display:flex;flex-wrap:wrap;gap:8px} .wi{cursor:pointer;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;display:flex;align-items:center;gap:8px;color:var(--muted);transition:all .25s} .wi i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)} .wi.on{color:var(--text);background:rgba(0,255,133,.1);border-color:rgba(0,255,133,.4)} .wi.on i{background:var(--accent);box-shadow:0 0 8px var(--accent)} .wi:hover{transform:translateY(-1px)}
  /* sound picker */
  .sp{width:100%} .sp .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .sp .tab{all:unset;cursor:pointer;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;transition:all .25s} .sp .tab i{width:8px;height:8px;border-radius:50%;background:var(--c)} .sp .tab.on{color:var(--text);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
  .sp input.q{all:unset;margin-left:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text);width:150px} .sp input.q::placeholder{color:var(--muted)}
  .sp .cat{font-size:11px;color:var(--muted);margin:10px 2px 6px;letter-spacing:.5px;text-transform:uppercase}
  .sp .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;max-height:300px;overflow:auto;padding:2px}
  .sp .pr{all:unset;cursor:pointer;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.035);font-size:12.5px;display:flex;align-items:center;gap:8px;transition:transform .3s var(--spring),background .2s,border-color .2s;position:relative}
  .sp .pr i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none} .sp .pr:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)} .sp .pr.on{border-color:var(--accent);background:rgba(0,255,133,.1)}
  .sp .pr .fav{margin-left:auto;opacity:.25;font-size:12px} .sp .pr .fav.on{opacity:1;color:#FFD60A}
  .sp .meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:12px}
  main{display:flex;flex-direction:column;min-width:0}
  header{height:52px;display:flex;align-items:center;padding:0 22px;gap:10px;flex:none}
  header h1{font-size:15px;margin:0;font-weight:650} header .grow{flex:1}
  .btn{all:unset;cursor:pointer;height:30px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);transition:transform .3s var(--spring),background .25s,box-shadow .3s;-webkit-app-region:no-drag}
  .btn:hover{transform:translateY(-1px) scale(1.02);background:rgba(255,255,255,.09)} .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06110a;border-color:transparent;box-shadow:0 6px 24px -6px var(--accent)}
  .panes{position:relative;flex:1;overflow:hidden}
  .pane{position:absolute;inset:0;padding:4px 22px 22px;overflow:auto;opacity:0;transform:translateX(22px) scale(.985);pointer-events:none;transition:opacity .35s var(--ease),transform .5s var(--ease)}
  .pane.on{opacity:1;transform:none;pointer-events:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;animation:rise .6s var(--ease) both;margin-bottom:14px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0;padding-top:0} .row .l{display:flex;flex-direction:column;gap:2px;min-width:0} .row .l small{color:var(--muted);font-size:12px}
  /* modules grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .mod{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .4s var(--spring),border-color .3s,background .3s;animation:rise .6s var(--ease) both}
  .mod:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
  .mod .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-right:52px}
  .mod .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:all .3s}
  .mod .ic svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
  .mod.on .ic{background:rgba(0,255,133,.12);border-color:rgba(0,255,133,.35);box-shadow:0 0 18px -4px var(--accent)} .mod.on .ic svg{stroke:var(--accent)}
  .mod h4{margin:0;font-size:14px;font-weight:650} .mod p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
  .mod .tg{position:absolute;top:14px;right:14px}
  .mod .need{font-size:10.5px;color:#FFB300;margin-top:8px;display:none} .mod.needs .need{display:block}
  .hero{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(0,255,133,.12),rgba(0,212,255,.06));border:1px solid rgba(0,255,133,.2);margin-bottom:16px}
  .hero h2{margin:0 0 4px;font-size:18px} .hero p{margin:0;color:var(--muted);font-size:13px} .hero .n{margin-left:auto;font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--accent)}
  /* controls */
  .tg{width:42px;height:25px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .3s;flex:none}
  .tg::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .45s var(--spring)}
  .tg.on{background:var(--accent);box-shadow:0 0 16px -2px var(--accent)} .tg.on::after{transform:translateX(17px)}
  .sl{display:flex;align-items:center;gap:12px;min-width:240px} .sl output{width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
  input[type=range]{-webkit-appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.12) var(--p,50%));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .3s var(--spring)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{all:unset;cursor:pointer;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;display:flex;align-items:center;gap:8px;transition:transform .35s var(--spring),background .25s,border-color .25s}
  .chip i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .chip:hover{transform:translateY(-2px)} .chip.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
  .sw{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
  .sw b{width:26px;height:26px;border-radius:50%;background:var(--c);cursor:pointer;border:2px solid transparent;transition:transform .4s var(--spring),box-shadow .3s,border-color .2s}
  .sw b:hover{transform:scale(1.18)} .sw b.on{border-color:#fff;transform:scale(1.1);box-shadow:0 0 16px var(--c)}
  .sw b.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden} .sw b.custom input{position:absolute;inset:-10px;opacity:0;cursor:pointer}
  .seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:8px;font-size:13px;color:var(--muted);transition:all .25s} .seg button.on{color:#06110a;background:var(--accent)}
  .preview{aspect-ratio:16/10;border-radius:14px;background:#0a0a0f;border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;transition:transform .5s var(--spring);max-width:420px}
  .preview:hover{transform:scale(1.015)} .preview canvas{position:absolute;inset:0;width:100%;height:100%}
  .note{font-size:12px;color:#FFB300;background:rgba(255,179,0,.08);border:1px solid rgba(255,179,0,.25);border-radius:12px;padding:10px 12px;margin-bottom:14px;display:none} .note.show{display:block}
  .toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,30px);background:rgba(20,20,26,.92);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;opacity:0;transition:all .5s var(--spring);pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .about{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:10px}
  .about .logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 20px 60px -10px var(--accent);display:grid;place-items:center;animation:float 5s ease-in-out infinite} .about .logo svg{width:40px;fill:#06110a}
  @keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}} .about h2{margin:8px 0 0;font-size:26px} .about p{margin:0;color:var(--muted);max-width:380px}
</style>
</head>
<body>
<div class="win">
  <div class="aura"></div>
  <aside>
    <div class="brand drag"><div class="dot"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>Surge</div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div class="vol" id="vol"><div class="vt"><span>Master volume</span><span id="mute" title="Mute all (⌘⇧M)">🔊</span></div><input type="range" min="0" max="1" step=".01" id="master"></div>
    <div class="status"><span class="led" id="led"></span><span id="batt"><b>—</b> reading…</span></div>
  </aside>
  <main>
    <header class="drag"><h1 id="title">Modules</h1><div class="grow"></div><button class="btn" id="qGlow">⚡ Preview glow</button></header>
    <div class="panes" id="panes"></div>
    <div class="toast" id="toast">Saved</div>
  </main>
</div>
<script src="engine.js"></script>
<script src="sounds.js"></script>
<script>
const $ = s => document.querySelector(s), api = window.surge;
const ICONS = {
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', keyboard:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>',
  mouse:'<rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v3"/>', ripple:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>',
  spot:'<circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>', moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  caps:'<path d="M12 4 4 12h5v8h6v-8h5z"/>', coffee:'<path d="M4 8h12v6a5 5 0 0 1-10 0z"/><path d="M16 9h2a2 2 0 1 1 0 4h-2M6 20h10"/>',
  clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V2h6v2"/>', timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>', wifi:'<path d="M2 9a16 16 0 0 1 20 0M5 13a11 11 0 0 1 14 0M8.5 16.5a6 6 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/>',
  contrast:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/>', wpm:'<path d="M3 17l4-8 4 8 4-8 4 8"/>', keys:'<path d="M15 7a4 4 0 1 1-2.8 6.8L7 19H4v-3l5.2-5.2A4 4 0 0 1 15 7z"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',dock:'<rect x="2" y="15" width="20" height="6" rx="3"/><path d="M6 18h.01M10 18h.01M14 18h.01M18 18h.01"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
};
const ic = n => `<svg viewBox="0 0 24 24">${ICONS[n]||ICONS.bolt}</svg>`;
let S = {}, MODS = [], hook = 'unavailable', cur = 'all', mini = null, pkind = 'plug';
const fmt = (f, v) => f==='pct' ? Math.round(v*100)+'%' : f==='px' ? v+'px' : f==='s' ? (+v).toFixed(1)+'s' : f==='x' ? (+v).toFixed(2)+'×' : v;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1000); }
let saveT, pending = { modules: {} };
function set(id, patch){ S.modules[id] = { ...S.modules[id], ...patch }; pending.modules[id] = { ...(pending.modules[id]||{}), ...patch }; paint();
  clearTimeout(saveT); saveT = setTimeout(async()=>{ const p = pending; pending = { modules: {} }; await api?.setSettings(p); toast('Saved'); }, 200); }

/* ---------- build UI ---------- */
function build(){
  const groups = ['Glow','Sound','Screen','Productivity','System'];
  let nav = `<button data-p="all" class="on"><span class="ic">${ic('grid')}</span>All modules</button>`;
  for (const g of groups){ const ms = MODS.filter(m=>m.group===g); if(!ms.length) continue; nav += `<div class="grp">${g}</div>` + ms.map(m=>`<button data-p="${m.id}"><span class="ic">${ic(m.icon)}</span>${m.name}<span class="led"></span></button>`).join(''); }
  nav += `<div class="grp">App</div><button data-p="about"><span class="ic">${ic('info')}</span>About</button>`;
  $('#nav').innerHTML = nav;
  let panes = `<section class="pane on" id="pane-all">
    <div class="hero"><div><h2>Your Mac, with extras.</h2><p>Flip anything on. Each module is independent, tiny, and lives in the menu bar.</p></div><div class="n"><span id="onCount">0</span>/${MODS.length}</div></div>
    <div class="note" id="hookNote"></div>
    <div class="grid">${MODS.map((m,i)=>`<div class="mod ${m.needsHook?'needs':''}" data-m="${m.id}" style="animation-delay:${i*40}ms"><div class="top"><div class="ic">${ic(m.icon)}</div><h4>${m.name}</h4></div><p>${m.desc}</p><div class="need">Needs Input Monitoring permission</div><div class="tg" data-m="${m.id}"></div></div>`).join('')}</div></section>`;
  for (const m of MODS) panes += `<section class="pane" id="pane-${m.id}"><div class="card"><h3>${m.name}</h3><div class="row"><div class="l">Enabled<small>${m.desc}</small></div><div class="tg" data-m="${m.id}"></div></div>${m.needsHook?'<div class="row"><div class="l"><small id="hook-'+m.id+'"></small></div></div>':''}</div>${m.id==='glow'?'<div class="card"><h3>Live preview</h3><div class="preview" id="preview"><canvas id="pc"></canvas></div></div>':''}${m.schema.length?'<div class="card"><h3>Options</h3>'+m.schema.map(f=>field(m,f)).join('')+'</div>':''}</section>`;
  panes += `<section class="pane" id="pane-about"><div class="about"><div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><h2>Surge</h2><p>${MODS.length} modules and counting. Every sound is synthesised, every glow is drawn live, nothing phones home.</p><p style="font-size:12px">v2.0.0 · <span id="reset" style="cursor:pointer;text-decoration:underline">reset all settings</span></p></div></section>`;
  $('#panes').innerHTML = panes;
  // wire
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.p));
  document.querySelectorAll('.tg[data-m]').forEach(t => t.onclick = (e) => { e.stopPropagation(); set(t.dataset.m, { enabled: !S.modules[t.dataset.m].enabled }); });
  document.querySelectorAll('.mod').forEach(c => c.onclick = () => go(c.dataset.m));
  document.querySelectorAll('[data-f]').forEach(wire);
  $('#master').oninput = (e) => { e.target.style.setProperty('--p', e.target.value*100+'%'); S.masterVolume = +e.target.value; clearTimeout(saveT); saveT = setTimeout(()=>api?.setSettings({ masterVolume: +e.target.value }), 150); };
  $('#master').onchange = () => audition('keyboard', S.modules.keys?.preset);
  $('#mute').onclick = () => { S.muted = !S.muted; api?.setSettings({ muted: S.muted }); paint(); };
  $('#qGlow').onclick = () => api?.preview('preview');
  $('#reset').onclick = async () => { S = await api?.resetSettings() || S; paint(); toast('Reset'); };
  const pc = $('#pc'); if (pc) { mini = SurgeEngine.create(pc, { loop:true, gap:1400, refWidth:1440, capsuleScale:1.6 }); $('#preview').onclick = () => replay(); }
}
function field(m, f){
  const id = `${m.id}.${f.k}`;
  if (f.t==='toggle') return `<div class="row"><div class="l">${f.label}${f.hint?`<small>${f.hint}</small>`:''}</div><div class="tg" data-f="${id}" data-t="toggle"></div></div>`;
  if (f.t==='range') return `<div class="row"><div class="l">${f.label}</div><div class="sl"><input type="range" min="${f.min}" max="${f.max}" step="${f.step}" data-f="${id}" data-t="range" data-fmt="${f.fmt||''}"><output></output></div></div>`;
  if (f.t==='chips') return `<div class="row"><div class="l">${f.label}</div><div class="chips" data-f="${id}" data-t="chips">${f.opts.map(o=>`<button class="chip" data-v="${o[0]}" style="--c:${o[2]||'#fff'}"><i></i>${o[1]}</button>`).join('')}</div></div>`;
  if (f.t==='color') return `<div class="row"><div class="l">${f.label}</div><div class="sw" data-f="${id}" data-t="color">${f.opts.map(c=>`<b style="--c:${c}" data-v="${c}"></b>`).join('')}<b class="custom"><input type="color"></b></div></div>`;
  if (f.t==='seg') return `<div class="row"><div class="l">${f.label}</div><div class="seg" data-f="${id}" data-t="seg">${f.opts.map(o=>`<button data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`;
  if (f.t==='soundpicker') return `<div class="row" style="flex-direction:column;align-items:stretch"><div class="l" style="margin-bottom:8px">${f.label}<small>Click any sound to hear it and select it. ★ to favourite.</small></div><div class="sp" data-f="${id}" data-t="soundpicker" data-lib="${f.lib}"></div></div>`;
  if (f.t==='widgets') return `<div class="row" style="flex-direction:column;align-items:stretch"><div class="l" style="margin-bottom:8px">${f.label}<small>Click to toggle · drag to reorder</small></div><div class="wl" data-f="${id}" data-t="widgets" data-opts="${f.opts.join(',')}"></div></div>`;
  if (f.t==='actions') return `<div class="row"><div class="l">${f.label}</div><div class="chips">${f.opts.map(o=>`<button class="btn" data-a="${m.id}:${o[0]}">${o[1]}</button>`).join('')}</div></div>`;
  return '';
}
function wire(el){
  const [mid, k] = el.dataset.f.split('.'), t = el.dataset.t;
  if (t==='toggle') el.onclick = () => set(mid, { [k]: !S.modules[mid][k] });
  if (t==='range') { el.oninput = () => { syncRange(el); S.modules[mid][k] = +el.value; if (mid==='glow') mini?.set(k, +el.value); }; el.onchange = () => { set(mid, { [k]: +el.value }); if (mid==='glow') replay(); }; }
  if (t==='chips') el.querySelectorAll('.chip').forEach(c => c.onclick = () => { set(mid, { [k]: c.dataset.v }); if (mid==='glow') replay(); });
  if (t==='color') { el.querySelectorAll('b[data-v]').forEach(b => b.onclick = () => { set(mid, { [k]: b.dataset.v }); if (mid==='glow') replay(); }); el.querySelector('input[type=color]').oninput = e => set(mid, { [k]: e.target.value.toUpperCase() }); }
  if (t==='soundpicker') buildPicker(el, mid, k);
  if (t==='widgets') buildWidgets(el, mid, k);
  if (t==='seg') el.querySelectorAll('button').forEach(b => b.onclick = () => set(mid, { [k]: isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v }));
}
document.addEventListener('click', async e => { const a = e.target.closest('[data-a]'); if (!a) return; const [mid, act] = a.dataset.a.split(':');
  if (mid==='glow' && act!=='stats') { api?.preview(act); replay(act==='preview'?'plug':act); return; }
  const r = await api?.action(mid, act); if (act==='stats') toast(`${r ?? 0} keys today`); else toast('Done'); });
function buildPicker(el, mid, k){
  const lib = el.dataset.lib; const cats = lib==='keyboard' ? SurgeSounds.keyboard : [{ id:'mouse', name:'Clicks', color:'#00FF85', presets: SurgeSounds.mouse }];
  el._cat = 'all'; el._q = '';
  const render = () => {
    const s = S.modules[mid] || {}, favs = new Set(s.favorites || []);
    let html = `<div class="tabs"><button class="tab ${el._cat==='all'?'on':''}" data-c="all">All</button>${lib==='keyboard'?`<button class="tab ${el._cat==='fav'?'on':''}" data-c="fav">★ Favourites</button>`:''}${cats.length>1?cats.map(c=>`<button class="tab ${el._cat===c.id?'on':''}" data-c="${c.id}" style="--c:${c.color}"><i></i>${c.name}</button>`).join(''):''}<input class="q" placeholder="Search ${SurgeSounds.count} sounds…" value="${el._q}"></div>`;
    const q = el._q.toLowerCase();
    for (const c of cats){ if (el._cat!=='all' && el._cat!=='fav' && el._cat!==c.id) continue;
      const ps = c.presets.filter(p => (!q || p.name.toLowerCase().includes(q)) && (el._cat!=='fav' || favs.has(p.id)));
      if (!ps.length) continue;
      if (el._cat==='all' || el._cat==='fav') html += `<div class="cat">${c.name}${c.desc?' · '+c.desc:''}</div>`;
      html += `<div class="list">${ps.map(p=>`<button class="pr ${s[k]===p.id?'on':''}" data-id="${p.id}" style="--c:${c.color}"><i></i>${p.name}${lib==='keyboard'?`<span class="fav ${favs.has(p.id)?'on':''}" data-fav="${p.id}">★</span>`:''}</button>`).join('')}</div>`; }
    html += `<div class="meta"><span>${SurgeSounds.count} keyboard · ${SurgeSounds.mouse.length} mouse</span><span>Selected: <b>${(lib==='keyboard'?SurgeSounds.findKey(s[k]):SurgeSounds.findMouse(s[k])).name}</b></span><span style="cursor:pointer" data-rand="1">🎲 Surprise me</span></div>`;
    el.innerHTML = html;
    el.querySelectorAll('.tab').forEach(b => b.onclick = () => { el._cat = b.dataset.c; render(); });
    const qi = el.querySelector('input.q'); qi.oninput = () => { el._q = qi.value; const pos = qi.selectionStart; render(); const n = el.querySelector('input.q'); n.focus(); n.setSelectionRange(pos,pos); };
    el.querySelectorAll('.pr').forEach(b => b.onclick = (e) => { if (e.target.dataset.fav) { const f = new Set(S.modules[mid].favorites||[]); f.has(e.target.dataset.fav) ? f.delete(e.target.dataset.fav) : f.add(e.target.dataset.fav); set(mid, { favorites: [...f] }); render(); return; }
      set(mid, { [k]: b.dataset.id }); audition(lib, b.dataset.id); render(); });
    el.querySelector('[data-rand]').onclick = () => { const all = lib==='keyboard' ? SurgeSounds.all : SurgeSounds.mouse; const p = all[Math.floor(Math.random()*all.length)]; set(mid, { [k]: p.id }); audition(lib, p.id); render(); };
  };
  el._render = render; render();
}
function audition(lib, id){ const s = S.modules; if (lib==='keyboard') { api?.testSound('key', { preset: id, volume: s.keys.volume, variance: s.keys.pitchVariance, kind: 'key' }); setTimeout(()=>api?.testSound('key', { preset: id, volume: s.keys.volume*.5, kind: 'up' }), 90); setTimeout(()=>api?.testSound('key', { preset: id, volume: s.keys.volume, variance: s.keys.pitchVariance, kind: 'key' }), 220); }
  else { api?.testSound('click', { preset: id, volume: s.mouse.volume }); setTimeout(()=>api?.testSound('click', { preset: id, volume: s.mouse.volume, up: true }), 80); } }
const WNAMES={clock:'Clock',battery:'Battery',stats:'CPU / Mem',media:'Now Playing',volume:'Volume',focus:'Focus',caffeine:'Caffeine',glow:'Glow',notes:'Notes',spotlight:'Spotlight'};
function buildWidgets(el, mid, k){
  const all = el.dataset.opts.split(',');
  const render = () => { const cur = S.modules[mid]?.[k] || []; const items = [...cur, ...all.filter(x=>!cur.includes(x))];
    el.innerHTML = items.map(w=>`<div class="wi ${cur.includes(w)?'on':''}" draggable="true" data-w="${w}"><i></i>${WNAMES[w]||w}</div>`).join('');
    let drag=null; el.querySelectorAll('.wi').forEach(d=>{ d.onclick=()=>{ const c=S.modules[mid][k]||[]; set(mid,{[k]: c.includes(d.dataset.w)?c.filter(x=>x!==d.dataset.w):[...c,d.dataset.w]}); render(); };
      d.ondragstart=()=>{ drag=d.dataset.w; }; d.ondragover=e=>e.preventDefault(); d.ondrop=e=>{ e.preventDefault(); if(!drag||drag===d.dataset.w) return; const c=(S.modules[mid][k]||[]).filter(x=>x!==drag); const i=c.indexOf(d.dataset.w); c.splice(i<0?c.length:i,0,drag); set(mid,{[k]:c}); render(); }; }); };
  el._render = render; render();
}
function syncRange(r){ r.style.setProperty('--p', (r.value-r.min)/(r.max-r.min)*100+'%'); r.nextElementSibling.value = fmt(r.dataset.fmt, +r.value); }
function go(p){ cur = p; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.p===p)); document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on', x.id===`pane-${p}`));
  $('#title').textContent = p==='all' ? 'Modules' : p==='about' ? 'About' : MODS.find(m=>m.id===p)?.name || ''; if (p==='glow') replay(); }
function paint(){
  let on = 0;
  for (const m of MODS){ const s = S.modules[m.id] || {}; if (s.enabled) on++;
    document.querySelectorAll(`.tg[data-m="${m.id}"]`).forEach(t=>t.classList.toggle('on', !!s.enabled));
    document.querySelector(`.mod[data-m="${m.id}"]`)?.classList.toggle('on', !!s.enabled);
    document.querySelector(`#nav button[data-p="${m.id}"]`)?.classList.toggle('live', !!s.enabled);
    for (const f of m.schema){ if (!f.k) continue; const el = document.querySelector(`[data-f="${m.id}.${f.k}"]`); if (!el) continue; const v = s[f.k];
      if (f.t==='toggle') el.classList.toggle('on', !!v);
      if (f.t==='range') { el.value = v; syncRange(el); }
      if (f.t==='chips') el.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.v==String(v)));
      if (f.t==='color') el.querySelectorAll('b[data-v]').forEach(b=>b.classList.toggle('on', (b.dataset.v||'').toLowerCase()===(v||'').toLowerCase()));
      if (f.t==='seg') el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v==String(v)));
      if (f.t==='soundpicker' && el._render && !el.contains(document.activeElement)) el._render();
      if (f.t==='widgets' && el._render) el._render();
    }
    const h = document.getElementById('hook-'+m.id); if (h) h.textContent = hook==='running' ? 'Input monitoring: active' : hook==='ready' ? 'Turns on when enabled — macOS will ask for Input Monitoring permission once.' : hook==='error' ? 'Input Monitoring blocked. System Settings → Privacy & Security → Input Monitoring → enable Surge, then relaunch.' : 'Global input hook not installed in this build (uiohook-napi). Run npm install on a Mac.';
  }
  $('#onCount').textContent = on;
  const mv = $('#master'); if (document.activeElement !== mv) { mv.value = S.masterVolume ?? 1; mv.style.setProperty('--p', (S.masterVolume ?? 1)*100+'%'); }
  $('#vol').classList.toggle('muted', !!S.muted); $('#mute').textContent = S.muted ? '🔇' : '🔊';
  const note = $('#hookNote'); note.classList.toggle('show', hook==='error' || hook==='unavailable'); note.textContent = hook==='error' ? 'Keyboard/mouse modules need Input Monitoring: System Settings → Privacy & Security → Input Monitoring → Surge. Then relaunch.' : hook==='unavailable' ? 'Keyboard/mouse modules are unavailable in this build (native hook missing).' : '';
  const g = S.modules.glow || {}; document.documentElement.style.setProperty('--accent', g.theme==='ember' ? '#FF9500' : g.theme==='ice' ? '#7DF9FF' : g.theme==='solid' ? g.color : '#00FF85');
  mini?.assign(g);
}
function replay(kind){ if (kind) pkind = kind; if (!mini) return; mini.assign(S.modules.glow||{}); mini.fire(pkind, pkind==='low'?12:pkind==='full'?100:67); }

(async()=>{
  MODS = await api?.listModules() || []; S = await api?.getSettings() || { modules:{} }; hook = await api?.hookState() || 'unavailable';
  build(); paint(); replay();
  api?.on('settings:update', s => { S = s; paint(); }); api?.on('nav', go);
  async function batt(){ const b = await api?.getBattery(); if (b) { $('#batt').innerHTML = `<b>${b.level}%</b> ${b.charged?'full':b.charging?'charging':'on battery'}${b.remaining?' · '+b.remaining:''}`; $('#led').style.background = b.charging ? '' : '#FFB648'; } hook = await api?.hookState() || hook; }
  batt(); setInterval(batt, 3000);
})();
</script>
</body>
</html>
