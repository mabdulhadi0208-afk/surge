<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="nova.css">
<style>
  html,body{height:auto;overflow:hidden}
  body{padding:6px 8px 16px}
  #mn{padding:7px;border-radius:24px;transform-origin:50% 0}
  #mn.show{animation:nv-pop .5s var(--jelly) both}
  .hd{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:5px;border-radius:18px;
    background:radial-gradient(70% 120% at 100% 0%,color-mix(in srgb,var(--accent3) 30%,transparent),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.7)),color-mix(in srgb,var(--accent3) 14%,rgba(255,255,255,.6)));box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7)}
  @media (prefers-color-scheme:dark){.hd{background:radial-gradient(70% 120% at 100% 0%,color-mix(in srgb,var(--accent3) 30%,transparent),transparent 70%),linear-gradient(135deg,rgba(40,46,84,.9),rgba(24,22,50,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08)}}
  .hd .tile{--ts:32px;--ic:var(--accent);border-radius:10px}
  .hd b{font:900 19px/1 var(--display);letter-spacing:-.045em;color:var(--fg)}
  .hd .wm{position:absolute;right:-8px;top:-12px;width:70px;height:70px;z-index:-1;color:color-mix(in srgb,var(--accent3) 40%,transparent);transform:rotate(-12deg)}
  .hd .wm svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:4px 8px 4px 5px;border-radius:12px;cursor:pointer;font:500 13px/1.2 var(--font);color:var(--fg);transition:transform .5s var(--jelly)}
  .mi .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent)}
  .mi .ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mi .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mi:hover,.mi.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent3) 10%,transparent))}
  .mi:hover .ic,.mi.sel .ic{color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent3));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px -4px var(--accent)}
  .mi:active{transform:scale(.97)}
  .mi.st{cursor:default;color:var(--fg3);font-size:12px}
  .mi.st:hover{background:none}.mi.st:hover .ic{color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent)}
  .mi.dg:hover,.mi.dg.sel{background:color-mix(in srgb,var(--red) 14%,transparent)}
  .mi.dg:hover .ic,.mi.dg.sel .ic{background:linear-gradient(145deg,#ff7a8a,var(--red));color:#fff}
  .kb{display:flex;gap:3px}
  .ms{height:1px;margin:5px 10px;background:var(--line)}
  .sw{width:32px;height:20px;flex:none;border-radius:999px;position:relative;background:var(--press)}
  .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(10,14,40,.35);transition:transform .62s var(--jelly)}
  .sw.on{background:linear-gradient(120deg,var(--accent),var(--accent3))}.sw.on::after{transform:translateX(12px)}
  .chev{width:14px;height:14px;fill:none;stroke:var(--fg3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--jelly)}
  .open>.chev{transform:rotate(90deg)}
  .sub{display:none;margin:2px 0 4px 18px;padding-left:8px;border-left:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .sub.show{display:block;animation:nv-in .45s var(--jelly) both}
  .cnt:empty{display:none}
  .cnt{font:750 10.5px/1 var(--display);color:var(--ink);padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
</style>
<script src="nova.js"></script>
<link rel="stylesheet" href="maison.css"></head><body>
<div id="mn" class="surface"><div class="hd"><div class="wm"></div><div class="tile"></div><b>Surge</b></div><div id="list"></div></div>
<script>
const api=window.nova||{onMenu(){},pick(){},size(){},close(){}}, N=window.Nova, $=s=>document.querySelector(s);
$('.hd .tile').innerHTML=N.ic('bolt'); $('.hd .wm').innerHTML=N.ic('spark');
const pick=(l,it)=>{ const s=l.toLowerCase(); if(/^settings/.test(s)) return 'gear'; if(/note/.test(s)) return 'notes'; if(/mute|sound/.test(s)) return 'mute'; if(/login/.test(s)) return 'power'; if(/^quit/.test(s)) return 'x';
  if(/update|restart/.test(s)) return 'refresh'; if(/^about/.test(s)) return 'info'; if(/glow|charg|battery|plugged|unplug/.test(s)) return 'bolt'; if(/clipboard/.test(s)) return 'clip'; if(/picker/.test(s)) return 'grid'; if(/awake|caffeine|keep|sleep/.test(s)) return 'coffee';
  if(/focus|break|timer/.test(s)) return 'timer'; if(/spotlight/.test(s)) return 'spot'; if(/cpu|memory|load/.test(s)) return 'chip'; if(/typing|keys/.test(s)) return 'wpm'; return it&&it.nested?'copy':'spark'; };
let flat=[], sel=-1;
function row(it,nested){ if(it.type==='separator') return '<div class="ms"></div>';
  const icon=N.ic(pick(it.label,{nested}));
  if(!it.enabled&&it.type==='normal') return `<div class="mi st"><span class="ic">${icon}</span><span class="lb">${N.esc(it.label)}</span></div>`;
  const right=it.type==='checkbox'?`<span class="sw${it.checked?' on':''}"></span>`:it.type==='submenu'?`<span class="cnt">${(it.sub||[]).filter(x=>x.type!=='separator'&&x.enabled).length||''}</span><svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>`:it.acc?`<span class="kb">${it.acc.split(/[ +]/).map(k=>`<kbd>${N.esc(k)}</kbd>`).join('')}</span>`:'';
  const sub=it.type==='submenu'?`<div class="sub">${(it.sub||[]).map(s=>row(s,true)).join('')}</div>`:'';
  return `<button class="mi ${/^quit/i.test(it.label)?'dg':''}" data-id="${it.id}" data-t="${it.type}" ${it.type==='checkbox'?`data-c="${it.checked?1:0}"`:''}><span class="ic">${icon}</span><span class="lb">${N.esc(it.label)}</span>${right}</button>${sub}`; }
const vis=()=>[...document.querySelectorAll('#list .mi[data-id]')].filter(b=>b.offsetParent);
let lastH=0; function fit(){ const h=Math.ceil($('#mn').offsetHeight+22); if(h!==lastH){ lastH=h; api.size(h); } }
new ResizeObserver(fit).observe(document.getElementById('mn'));
function act(b){ if(!b) return; if(b.dataset.t==='submenu'){ b.classList.toggle('open'); b.nextElementSibling.classList.toggle('show'); requestAnimationFrame(fit); return; }
  if(b.dataset.t==='checkbox'){ const on=b.dataset.c!=='1'; b.querySelector('.sw').classList.toggle('on',on); setTimeout(()=>api.pick(b.dataset.id,on),140); return; } api.pick(b.dataset.id); }
api.onMenu(d=>{ lastH=0; $('#list').innerHTML=d.items.map(i=>row(i,false)).join(''); sel=-1; const m=$('#mn'); m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
  document.querySelectorAll('#list .mi[data-id]').forEach(b=>{ b.onclick=()=>act(b); b.onmouseenter=()=>{ document.querySelectorAll('.mi.sel').forEach(x=>x.classList.remove('sel')); sel=vis().indexOf(b); }; });
  /* measured right away: a hidden window gets no animation frames, so waiting for one meant the menu never came back after its first close */ fit(); requestAnimationFrame(fit); });
addEventListener('keydown',e=>{ const v=vis(); if(e.key==='Escape') return api.close();
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+v.length)%v.length; v.forEach((b,i)=>b.classList.toggle('sel',i===sel)); }
  if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); act(v[sel]); } if(e.key==='ArrowLeft'){ const o=document.querySelector('.mi.open'); if(o) act(o); } });
</script></body></html>
