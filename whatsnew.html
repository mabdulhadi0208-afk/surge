<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="nova.css">
<link rel="stylesheet" href="maison.css">
<style>
  /* Surge's What's new film (3.1, Maison). One take, about seven seconds, shot like a title sequence: the letterbox bars
     part, the Surge mark sets down, a single emerald rule draws across, the name rises out of a mask letter by letter in
     Instrument Serif, the version follows in italic, the whole frame eases in very slightly (a slow push), then this
     version's changes slide up one by one with their serif numbers. Paper in light mode, ink in dark mode.
     Esc, Enter, Space or a click skips it. Only transform and opacity animate, every animation plays once, and with
     Reduce motion the film is a still card. */
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;cursor:default}
  body{display:grid;place-items:center;font-family:var(--m-font)}
  .stage{position:relative;width:780px;height:480px;border-radius:22px;overflow:hidden;isolation:isolate;color:var(--m-fg);background:var(--m-bg);box-shadow:0 0 0 1px var(--m-line),var(--m-float);
    animation:stageIn .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes stageIn{from{opacity:0;transform:scale(.97)}}
  .stage.out{animation:stageOut .42s cubic-bezier(.4,0,.6,1) both}
  @keyframes stageOut{to{opacity:0;transform:scale(.985)}}
  /* the letterbox: two ink bars that part as the film opens */
  .bar{position:absolute;left:0;right:0;height:50%;z-index:20;background:var(--m-solid);pointer-events:none}
  .bar.t{top:0;transform-origin:50% 0;animation:barT .9s cubic-bezier(.7,0,.2,1) .15s both}
  .bar.b{bottom:0;transform-origin:50% 100%;animation:barB .9s cubic-bezier(.7,0,.2,1) .15s both}
  @keyframes barT{from{transform:scaleY(1)}to{transform:scaleY(0)}} @keyframes barB{from{transform:scaleY(1)}to{transform:scaleY(0)}}
  /* the slow push: the frame settles from a hair larger over the whole film */
  .frame{position:absolute;inset:0;padding:40px 52px 34px;display:flex;flex-direction:column;animation:push 7s cubic-bezier(.2,.8,.2,1) .2s both}
  @keyframes push{from{transform:scale(1.035)}}
  .skip{position:absolute;right:18px;top:16px;z-index:30;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px!important;font-size:12px!important;opacity:0;animation:fade .5s 1.2s both}
  .skip kbd{height:17px;min-width:0;padding:0 5px}
  @keyframes fade{to{opacity:1}}
  .eye{display:flex;align-items:center;gap:10px;font:600 10.5px/1 var(--m-font);letter-spacing:.18em;text-transform:uppercase;color:var(--m-fg3);opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) 1.9s both}
  .eye i{width:6px;height:6px;border-radius:50%;background:var(--m-acc)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .wnhero{display:flex;align-items:flex-end;gap:22px;margin:12px 0 0}
  .gemw{position:relative;width:66px;height:66px;flex:none;margin-bottom:12px}
  .gem{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;background:var(--m-solid);color:var(--m-on-solid);animation:gem .8s var(--jelly) .75s both}
  .gem svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @keyframes gem{from{opacity:0;transform:translateY(-26px) scale(.7)}to{opacity:1;transform:none}}
  .gemw .halo{position:absolute;inset:-10px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--m-acc);opacity:0;animation:halo 1.1s cubic-bezier(.2,.8,.2,1) 1.05s both}
  @keyframes halo{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
  .words{display:flex;align-items:baseline;gap:18px;min-width:0}
  .name,.ver{display:inline-flex;overflow:hidden;padding:0 2px 10px}
  .name{font:400 96px/.92 var(--m-serif);letter-spacing:-.02em}
  .ver{font:italic 400 50px/1 var(--m-serif);color:var(--m-acc-ink);font-variant-numeric:tabular-nums}
  .ch{display:inline-block;transform:translateY(105%);animation:chIn .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes chIn{to{transform:none}}
  .rule{height:1px;margin:10px 0 16px;background:var(--m-line2);position:relative}
  .rule i{position:absolute;left:0;top:-.5px;height:2px;width:100%;background:var(--m-acc);transform-origin:0 50%;transform:scaleX(0);animation:draw 1.3s cubic-bezier(.65,0,.2,1) 1.2s both}
  @keyframes draw{to{transform:scaleX(1)}}
  ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:10px}
  ol.many{grid-template-columns:1fr 1fr;column-gap:30px;row-gap:12px}
  li{display:flex;align-items:baseline;gap:14px;font:450 15px/1.4 var(--m-font);color:var(--m-fg);opacity:0;animation:item .7s cubic-bezier(.2,.8,.2,1) var(--d) both}
  ol.many li{font-size:13.5px;line-height:1.35}
  @keyframes item{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  li .t{flex:none;min-width:22px;font:400 24px/1 var(--m-serif);color:var(--m-acc-ink);font-variant-numeric:tabular-nums}
  li .t svg{display:none}
  .prog{position:absolute;left:52px;right:52px;bottom:16px;height:1px;background:var(--m-line);overflow:hidden}
  .prog i{position:absolute;inset:0;background:var(--m-fg3);transform-origin:0 50%;transform:scaleX(0);animation:prog var(--len,7s) linear both}
  @keyframes prog{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important}.bar{display:none}}
</style>
<script src="nova.js"></script>
</head><body>
<div class="stage" id="stage" role="dialog" aria-label="What's new in Surge">
  <i class="bar t"></i><i class="bar b"></i>
  <button class="btn skip" id="skip">Skip <kbd>Esc</kbd></button>
  <div class="frame">
    <div class="eye"><i></i><b id="eye">What's new</b></div>
    <div class="wnhero" id="hero"><div class="gemw" id="gemw"><i class="halo"></i><div class="gem" id="gem"></div></div>
      <div class="words"><div class="name" id="name"></div><div class="ver" id="ver"></div></div></div>
    <div class="rule"><i></i></div>
    <ol id="items"></ol>
  </div>
  <div class="prog"><i id="prog"></i></div>
</div>
<script>
const $=s=>document.querySelector(s), api=window.surge, N=window.Nova;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const film=window.__film={ state:'loading', how:null, version:'', items:[] };
const letters=(el,txt,start,step)=>{ el.innerHTML=[...txt].map((c,i)=>`<span class="ch" style="animation-delay:${(start+i*step).toFixed(3)}s">${c===' '?'&nbsp;':N.esc(c)}</span>`).join(''); };
let endT=0;
function finish(how){ if(film.state!=='playing') return; film.state='out'; film.how=how; clearTimeout(endT);
  $('#stage').classList.add('out'); setTimeout(()=>api?.whatsNewDone?.(how), RM?0:420); }
async function start(){
  const d=await api?.whatsNew?.()||{ version:'', items:[] };
  film.version=d.version; film.items=(d.items||[]).map(i=>i.text);
  $('#gem').innerHTML=N.ic('bolt');
  letters($('#name'),'Surge',1.15,.06);
  $('#ver').innerHTML=''; const vs=document.createElement('span'); vs.style.display='inline-flex'; $('#ver').appendChild(vs); letters(vs,d.version,1.55,.06);
  $('#eye').textContent=`What's new in ${d.version}`;
  const items=d.items||[];
  $('#items').classList.toggle('many',items.length>3);
  $('#items').innerHTML=items.map((it,i)=>`<li style="--d:${(2.45+i*.32).toFixed(2)}s"><span class="t">${i+1}</span><span>${N.esc(it.text)}</span></li>`).join('');
  // the film runs as long as its words need: about seven seconds for a handful of changes
  const len=Math.round(Math.min(8800,(2.45+items.length*.32+3.2)*1000));
  $('#prog').style.setProperty('--len',len+'ms');
  film.state='playing'; film.length=len;
  endT=setTimeout(()=>finish('end'), RM?Math.max(len,9000):len);
}
addEventListener('keydown',e=>{ if(['Escape','Enter',' '].includes(e.key)){ e.preventDefault(); finish('skip'); } });
addEventListener('mousedown',()=>finish('skip'));
api?.on?.('whatsnew:replay',()=>location.reload());
start();
</script></body></html>
