name: Build DMG & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip3 install setuptools >/dev/null 2>&1 || true
      - run: npm install --no-audit --no-fund
      - name: Import signing certificate (stable identity so macOS permissions survive updates)
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > cert.p12
            security create-keychain -p temp build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p temp build.keychain
            security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
            echo "SIGN_ID=Surge Dev" >> $GITHUB_ENV
            echo "✓ certificate imported"
          else
            echo "SIGN_ID=-" >> $GITHUB_ENV
            echo "no MAC_CERT_P12 secret — falling back to ad-hoc signing"
          fi
      - name: Package + sign + DMG
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          APP=$(ls -d dist/mac*/Surge.app | head -1)
          find "$APP" \( -name "*.node" -o -name "*.dylib" \) -exec codesign --force --sign "$SIGN_ID" {} \;
          codesign --force --deep --sign "$SIGN_ID" "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Identifier|Signature" || true
          npx electron-builder --mac dmg --arm64 --publish never --prepackaged "$APP"
          ls -la dist/*.dmg
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: { name: Surge-dmg, path: "dist/*.dmg" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Surge ${{ steps.v.outputs.version }}
          files: dist/*.dmg
          body: |
            ⚡ Surge ${{ steps.v.outputs.version }}
            Download **Surge-mac-arm64.dmg**, drag to Applications, right-click → Open on first launch.
