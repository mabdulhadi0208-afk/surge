name: Build & Release
on:
  push:
    branches: [main, 'test/**']
    paths-ignore: ['docs/**', 'README.md']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund --prefer-offline || npm install --no-audit --no-fund
      - name: Import signing certificate (stable identity so macOS permissions survive updates)
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > cert.p12
          else
            cp build/cert/surge-dev.p12 cert.p12
            P12_PASSWORD=$(cat build/cert/password.txt | tr -d '\n')
          fi
          if [ -s cert.p12 ]; then
            security create-keychain -p temp build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p temp build.keychain
            security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
            echo "SIGN_ID=Surge Dev" >> $GITHUB_ENV
            echo "✓ certificate imported"
          else
            echo "SIGN_ID=-" >> $GITHUB_ENV
            echo "no certificate found — falling back to ad-hoc signing"
          fi
      - name: Package + sign + DMG
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          APP=$(ls -d dist/mac*/Surge.app | head -1)
          # explicit designated requirement pinned to the cert, so macOS TCC (Accessibility / Input Monitoring) treats every build as the same app
          REQ='designated => identifier "app.surge.glow" and certificate leaf = H"CBDD9960F4309101C52C2F71998F8EBAC8D5B200"'
          if [ "$SIGN_ID" = "-" ]; then
            find "$APP" \( -name "*.node" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
            codesign --force --deep --sign - "$APP"
          else
            find "$APP" \( -name "*.node" -o -name "*.dylib" \) -exec codesign --force --sign "$SIGN_ID" {} \;
            # nested code first with its own identity; the pinned requirement goes on the main bundle ONLY
            # (applying it with --deep stamped helpers/frameworks with a requirement they can never satisfy → "nested code is modified or invalid")
            codesign --force --deep --sign "$SIGN_ID" "$APP"
            codesign --force --sign "$SIGN_ID" --requirements "=$REQ" "$APP"
          fi
          codesign -d -r- "$APP" 2>&1 | tail -2
          # ZIP (what the in-app updater installs; quarantine is stripped on update) keeps the cert signature → stable identity, permissions survive updates.
          # DMG (fresh downloads) is re-signed AD-HOC: Gatekeeper calls a self-signed app "damaged", but an ad-hoc one just needs right-click → Open.
          ( cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent Surge.app ../Surge-mac-arm64.zip ) &
          ( STAGE=$(mktemp -d) && cp -R "$APP" "$STAGE/" \
            && find "$STAGE/Surge.app" \( -name "*.node" -o -name "*.dylib" \) -exec codesign --force --sign - {} \; \
            && codesign --force --deep --sign - "$STAGE/Surge.app" \
            && ln -s /Applications "$STAGE/Applications" \
            && hdiutil create -volname Surge -srcfolder "$STAGE" -ov -format UDZO -imagekey zlib-level=1 -quiet dist/Surge-mac-arm64.dmg ) &
          wait
          ls -la dist/*.dmg dist/*.zip
      - name: Release gate (refuse to publish broken files)
        run: |
          set -e
          APP=$(ls -d dist/mac*/Surge.app | head -1)
          # 1. updater zip: cert-signed with the pinned requirement → permissions survive updates
          codesign -d -r- "$APP" 2>&1 | grep -qi 'certificate leaf = H"CBDD9960F4309101C52C2F71998F8EBAC8D5B200"' && echo "✓ zip app has the pinned identity" || { echo "✗ zip app is not cert-signed"; exit 1; }
          codesign --verify --deep --strict "$APP" && echo "✓ zip app signature valid (strict, nested code included)" || { echo "✗ zip app signature INVALID"; exit 1; }
          # 2. DMG app: must be AD-HOC (a self-signed cert makes Gatekeeper say "damaged")
          MNT=$(mktemp -d); hdiutil attach -nobrowse -quiet -mountpoint "$MNT" dist/Surge-mac-arm64.dmg
          codesign -dv "$MNT/Surge.app" 2>&1 | grep -q 'Signature=adhoc' && echo "✓ dmg app is ad-hoc (right-click → Open works)" || { echo "✗ dmg app is NOT ad-hoc → would show as damaged"; hdiutil detach -quiet "$MNT"; exit 1; }
          codesign --verify --deep --strict "$MNT/Surge.app" && echo "✓ dmg app signature valid" || { echo "✗ dmg app signature INVALID"; hdiutil detach -quiet "$MNT"; exit 1; }
          test -L "$MNT/Applications" && echo "✓ dmg has Applications shortcut"
          hdiutil detach -quiet "$MNT"
          # 3. REAL update test: install to /Applications, launch, make it update itself (swap + relaunch), then make sure it STAYS up
          V=$(node -p "require('./package.json').version"); L=~/Library/Logs/Surge
          rm -rf /Applications/Surge.app "$L"; ditto "$APP" /Applications/Surge.app
          # make the runner look like a real user's Mac: keyboard/mouse permission GRANTED (so the native input hook really runs) and the heavy modules ON
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do for SVC in kTCCServiceAccessibility kTCCServiceListenEvent kTCCServicePostEvent; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access VALUES('$SVC','app.surge.glow',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000,NULL,NULL,'UNUSED',1700000000);" 2>/dev/null && echo "granted $SVC" || echo "could not grant $SVC ($DB)"; done; done
          mkdir -p "$HOME/Library/Application Support/Surge"
          echo '{"launchAtLogin":false,"welcomed":true,"modules":{"keys":{"enabled":true},"mouse":{"enabled":true},"ripple":{"enabled":true},"caps":{"enabled":true},"typing":{"enabled":true},"dock":{"enabled":true,"autohide":true},"stats":{"enabled":true},"clip":{"enabled":true},"focus":{"enabled":true},"caffeine":{"enabled":true}}}' > "$HOME/Library/Application Support/Surge/settings.json"
          (SURGE_SELFTEST=swap /Applications/Surge.app/Contents/MacOS/Surge >/dev/null 2>&1 &); sleep 4
          P1=$(pgrep -f "/Applications/Surge.app/Contents/MacOS/Surge" | head -1); [ -n "$P1" ] && echo "✓ app launched (pid $P1)" || { echo "✗ app did not launch"; cat $L/surge.log; exit 1; }
          sleep 30
          grep -q "launched OK" $L/update.log && echo "✓ update swap relaunched the app" || { echo "✗ swap did not relaunch"; cat $L/update.log $L/surge.log; exit 1; }
          P2=$(pgrep -f "/Applications/Surge.app/Contents/MacOS/Surge" | head -1); [ -n "$P2" ] && [ "$P2" != "$P1" ] && echo "✓ new process after update (pid $P2)" || { echo "✗ no new process after update"; cat $L/update.log $L/surge.log; exit 1; }
          sleep 15
          kill -0 $P2 2>/dev/null && echo "✓ still running 15s after the update (did not quit)" || { echo "✗ app QUIT after updating"; cat $L/update.log $L/surge.log; exit 1; }
          [ "$(grep -c "boot $V" $L/surge.log)" -ge 2 ] && echo "✓ booted twice, version $V" || { echo "✗ expected two boots"; cat $L/surge.log; exit 1; }
          grep -q "start glow" $L/surge.log && echo "✓ modules started" || { echo "✗ modules did not start"; cat $L/surge.log; exit 1; }
          grep -i "UNCAUGHT\|module load\|UNHANDLED" $L/surge.log && { echo "✗ errors in log"; exit 1; } || echo "✓ no errors in log"
          [ "$(grep -c "hook started (worker)" $L/surge.log)" -ge 2 ] && echo "✓ hook runs INSIDE Surge (worker thread) on both launches — uses Surge's own permission" || { echo "✗ hook did not start as an in-app worker on both launches"; cat $L/surge.log; exit 1; }
          [ "$(grep -c "hook started" $L/surge.log)" -ge 2 ] && echo "✓ keyboard/mouse hook started before AND after the update (permission granted, like a real Mac)" || { echo "✗ hook did not start on both launches"; cat $L/surge.log; exit 1; }
          [ "$(grep -c "start dock" $L/surge.log)" -ge 2 ] && echo "✓ startup ran to the end both times (no freeze)" || { echo "✗ startup did not finish (FROZEN)"; cat $L/surge.log; exit 1; }
          osascript -e 'with timeout of 5 seconds' -e 'tell application "System Events" to key code 49' -e 'end timeout' >/dev/null 2>&1 || true; sleep 2
          grep -q "hook first event" $L/surge.log && echo "✓ a real key press reached Surge through the hook" || echo "! could not send a synthetic key on this runner (event delivery not verified)"
          grep -q "audio ok" $L/surge.log && echo "✓ that key press played a keyboard sound (key → hook → sound engine)" || { echo "✗ key press produced NO sound"; cat $L/surge.log; exit 1; }
          echo "----- surge.log"; cat $L/surge.log; echo "----- update.log"; cat $L/update.log; ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i surge || true
          # 3b. watchdog: kill it the hard way, it must come back on its own
          kill -9 $P2; sleep 10
          P3=$(pgrep -f "/Applications/Surge.app/Contents/MacOS/Surge" | head -1); [ -n "$P3" ] && [ "$P3" != "$P2" ] && echo "✓ watchdog brought Surge back after a hard kill (pid $P3)" || { echo "✗ watchdog did not relaunch"; cat $L/surge.log; exit 1; }
          # 3c. a normal quit must stay quit
          kill -TERM $P3; sleep 8
          pgrep -f "/Applications/Surge.app/Contents/MacOS/Surge" >/dev/null && { echo "✗ Surge came back after a normal quit"; exit 1; } || echo "✓ normal quit stays quit"
          # 4. required files made it into the bundle
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" | grep -q "assets/tray/bolt.png" && echo "✓ tray assets bundled"
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" | grep -q "launchpad.html" && echo "✓ launchpad bundled"
          # 5. sizes sane
          for f in dist/Surge-mac-arm64.dmg dist/Surge-mac-arm64.zip; do s=$(stat -f%z "$f"); [ "$s" -gt 60000000 ] && echo "✓ $f $s bytes" || { echo "✗ $f too small ($s)"; exit 1; }; done
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Surge ${{ steps.v.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            ⚡ Surge ${{ steps.v.outputs.version }}
            Mac: download **Surge-mac-arm64.dmg**, drag to Applications, right-click → Open on first launch.
            Windows: run **Surge-win-x64.exe** (SmartScreen: More info → Run anyway).

  win:
    runs-on: windows-latest
    needs: mac
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npx electron-builder --win nsis --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Windows dock helper works (list / icon / activate)
        run: node scripts/test-winapps.js
      - uses: actions/upload-artifact@v4
        with: { name: win-icon, path: explorer-icon.png }
      - name: Release gate (installer installs, app boots)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if ($exe.Length -lt 50MB) { throw "installer too small: $($exe.Length)" }
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Surge\Surge.exe"
          # the one-click installer can hand off to a second process and return early — wait for the files instead of assuming
          for ($i = 0; $i -lt 60 -and !(Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (!(Test-Path $app)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue; throw "silent install did not produce $app after 60s" }
          Start-Sleep -Seconds 3
          "✓ installed to $app"
          $p = Start-Process -FilePath $app -PassThru; Start-Sleep -Seconds 10
          $log = "$env:USERPROFILE\AppData\Roaming\Surge\logs\surge.log"
          if (!(Test-Path $log)) { throw "no log written — app did not boot" }
          $v = node -p "require('./package.json').version"
          if (!(Select-String -Path $log -Pattern "boot $v" -Quiet)) { Get-Content $log; throw "boot line missing" }
          if (Select-String -Path $log -Pattern "UNCAUGHT|module load" -Quiet) { Get-Content $log; throw "errors during boot" }
          "✓ app boots on Windows and logs its version"; Get-Content $log | Select-Object -First 12
          Stop-Process -Name Surge -Force -ErrorAction SilentlyContinue
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: dist/*.exe
