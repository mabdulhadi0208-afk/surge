name: Build DMG & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip3 install setuptools >/dev/null 2>&1 || true
      - run: npm install --no-audit --no-fund
      - name: Package + ad-hoc sign + DMG
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          APP=$(ls -d dist/mac*/Surge.app | head -1)
          find "$APP" \( -name "*.node" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - "$APP"
          npx electron-builder --mac dmg --arm64 --publish never --prepackaged "$APP"
          ls -la dist/*.dmg
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: { name: Surge-dmg, path: "dist/*.dmg" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Surge ${{ steps.v.outputs.version }}
          files: dist/*.dmg
          body: |
            ⚡ Surge ${{ steps.v.outputs.version }} — 17-in-1 Mac toolbox.
            Download **Surge-mac-arm64.dmg**, drag to Applications, right-click → Open on first launch (ad-hoc signed, not notarized).
