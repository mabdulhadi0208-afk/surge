<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root{--a:#00FF85;--ink:#f2f2f6;--muted:#9a9aa6;--line:rgba(255,255,255,.1);--spring:cubic-bezier(.34,1.56,.64,1);--flow:cubic-bezier(.2,.8,.2,1)}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:transparent;font:13px/1.35 -apple-system,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;overflow:hidden}
  .box{height:100%;border-radius:22px;background:linear-gradient(180deg,#131824,#0b0e15);border:1px solid var(--line);box-shadow:0 40px 100px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;overflow:hidden}
  .box.in{animation:in .42s var(--flow)} @keyframes in{from{transform:translateY(14px) scale(.96);opacity:0}}
  .top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
  .top input{all:unset;flex:1;font-size:15px;padding:10px 13px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink)}
  .top input:focus{border-color:rgba(0,255,133,.5);box-shadow:0 0 0 3px rgba(0,255,133,.12)}
  .top .k{color:var(--muted);font-size:11px;white-space:nowrap}
  .list{flex:1;overflow:auto;padding:2px 8px 10px} .list::-webkit-scrollbar{width:8px} .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
  .it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s,transform .3s var(--spring);animation:row .4s var(--flow) backwards;animation-delay:calc(var(--i)*14ms)}
  @keyframes row{from{opacity:0;transform:translateX(-10px)}}
  .it:hover{background:rgba(255,255,255,.06)} .it.sel{background:rgba(0,255,133,.13);box-shadow:inset 0 0 0 1px rgba(0,255,133,.35)} .it:active{transform:scale(.985)}
  .it .n{width:20px;text-align:center;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:none} .it.sel .n{color:var(--a)}
  .it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .it .t b{color:var(--a);font-weight:700}
  .it .m{color:var(--muted);font-size:10.5px;flex:none} .it .x{all:unset;cursor:pointer;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0} .it:hover .x{opacity:1} .it .x:hover{background:rgba(255,92,92,.25);color:#fff}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .foot{display:flex;justify-content:space-between;padding:8px 16px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px} .foot a{cursor:pointer} .foot a:hover{color:var(--ink)}

  /* fluid max */
  .box{border:0;border-radius:26px;box-shadow:0 40px 100px -30px rgba(0,0,0,.95),0 0 70px -34px var(--a),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.05)}
  .box.in{animation:in .9s var(--spring-soft)} @keyframes in{from{transform:translateY(30px) scale(.86);opacity:0}}
  .top input{border:0;background:rgba(255,255,255,.07);border-radius:16px;transition:box-shadow .4s,background .3s,transform .7s var(--spring)} .top input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 26%,transparent);transform:scale(1.01)}
  .it{border-radius:14px;transition:background .25s,transform .7s var(--spring),box-shadow .3s;animation:row .8s var(--spring-soft) backwards;animation-delay:calc(var(--i)*22ms)} @keyframes row{from{opacity:0;transform:translateX(-26px) scale(.94)}}
  .it:hover{transform:translateX(5px)} .it.sel{background:color-mix(in srgb,var(--a) 16%,transparent);box-shadow:inset 3px 0 0 var(--a);transform:translateX(5px)}
  .foot{border-top:0;background:rgba(0,0,0,.22)}

  /* balanced pass */
  .list{position:relative} .selbar{position:absolute;left:8px;right:8px;top:0;height:0;border-radius:14px;background:color-mix(in srgb,var(--a) 15%,transparent);box-shadow:inset 3px 0 0 var(--a);pointer-events:none;transition:transform .55s var(--spring),height .4s var(--spring-soft);z-index:0}
  .it{position:relative;z-index:1} .it.sel,.it:hover{background:transparent!important;box-shadow:none!important}
  .kd{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--kc) 18%,transparent);transition:scale .6s var(--spring),rotate .6s var(--spring)} .kd svg{width:14px;height:14px;stroke:var(--kc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kd[title=Colour]{background:var(--kc);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 6px 14px -6px var(--kc);border-radius:50%} .it.sel .kd{scale:1.15;rotate:-6deg}
  .it .t.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
  kbd{font:inherit;font-size:10.5px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.09);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);color:var(--ink);margin:0 3px 0 8px}
</style><script>window.FLUID={blobs:1,magnet:'.none'}</script><link rel="stylesheet" href="fluid.css"><script defer src="fluid.js"></script><link rel="stylesheet" href="fx.css"><script defer src="fx.js"></script>
</head>
<body><div class="box" id="box">
  <div class="top"><input id="q" placeholder="Search your clipboard…" autofocus><span class="k"><kbd>↵</kbd> paste <kbd>⌘1–9</kbd> quick <kbd>esc</kbd> close</span></div>
  <div class="list" id="list"></div>
  <div class="foot"><span id="cnt"></span><a id="clear">Clear history</a></div>
</div>
<script>
const api=window.surge, $=s=>document.querySelector(s); let ALL=[], shown=[], sel=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mark(t,q){ const flat=t.replace(/\s+/g,' ').trim().slice(0,160); if(!q) return esc(flat); const i=flat.toLowerCase().indexOf(q); return i<0?esc(flat):esc(flat.slice(0,i))+'<b>'+esc(flat.slice(i,i+q.length))+'</b>'+esc(flat.slice(i+q.length)); }
const KIND={link:['Link','<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>','#5AB0FF'],mail:['Email','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>','#FFB300'],color:['Colour','<circle cx="12" cy="12" r="8"/>','#fff'],num:['Number','<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>','#B48CFF'],code:['Code','<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/>','#00E5A0'],text:['Text','<path d="M5 7h14M5 12h14M5 17h9"/>','#8b94a7']};
function kindOf(t){ const s=t.trim(); if(/^(https?:\/\/|www\.)\S+$/i.test(s)) return 'link'; if(/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(s)) return 'mail'; if(/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(s)||/^(rgb|hsl)a?\([^)]+\)$/i.test(s)) return 'color'; if(/^[-+]?[\d\s.,]+%?$/.test(s)&&/\d/.test(s)) return 'num'; if(/[{};]|=>|\b(function|const|let|import|def|class|return)\b|<\/?[a-z][^>]*>/.test(s)) return 'code'; return 'text'; }
function badge(t){ const k=kindOf(t), K=KIND[k]; return `<span class="kd" style="--kc:${k==='color'?t.trim():K[2]}" title="${K[0]}">${k==='color'?'':`<svg viewBox="0 0 24 24">${K[1]}</svg>`}</span>`; }
function glide(){ const l=$('#list'), s=l.querySelector('.it.sel'); let g=l.querySelector('.selbar'); if(!s){ g&&g.remove(); return; } if(!g){ g=document.createElement('i'); g.className='selbar'; l.prepend(g); g.style.transition='none'; requestAnimationFrame(()=>requestAnimationFrame(()=>g.style.transition='')); } g.style.transform=`translateY(${s.offsetTop}px)`; g.style.height=s.offsetHeight+'px'; }
function render(){ const q=$('#q').value.trim().toLowerCase(); shown=q?ALL.filter(t=>t.toLowerCase().includes(q)):ALL.slice(); sel=Math.min(sel,Math.max(0,shown.length-1));
  $('#list').innerHTML=shown.length?shown.map((t,i)=>`<div class="it ${i===sel?'sel':''}" data-i="${i}" style="--i:${Math.min(i,14)}"><span class="n">${i<9?i+1:''}</span>${badge(t)}<span class="t ${kindOf(t)==='code'?'mono':''}">${mark(t,q)}</span><span class="m">${t.length>160?t.length+' chars':''}</span><button class="x" data-x="${i}" title="Remove">×</button></div>`).join(''):`<div class="empty">${ALL.length?'Nothing matches':'Copy something and it shows up here'}</div>`;
  $('#cnt').textContent=ALL.length+(ALL.length===1?' item':' items')+' · kept in memory only'; glide(); }
function paste(t){ if(t) api?.action('clip','paste',t); }
$('#list').onclick=async e=>{ const x=e.target.closest('[data-x]'); if(x){ ALL=await api?.action('clip','remove',shown[+x.dataset.x])||[]; render(); return; } const it=e.target.closest('.it'); if(it) paste(shown[+it.dataset.i]); };
$('#q').oninput=()=>{ sel=0; render(); }; $('#clear').onclick=async()=>{ await api?.action('clip','clear'); ALL=[]; render(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ api?.hide(); return; } if(e.key==='Enter'){ paste(shown[sel]); return; }
  if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)){ e.preventDefault(); paste(shown[+e.key-1]); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(0,Math.min(shown.length-1,sel+(e.key==='ArrowDown'?1:-1))); document.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('sel',i===sel)); document.querySelector('.it.sel')?.scrollIntoView({block:'nearest'}); glide(); } });
$('#list').addEventListener('mouseover',e=>{ const it=e.target.closest('.it'); if(!it||+it.dataset.i===sel) return; sel=+it.dataset.i; document.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('sel',i===sel)); glide(); });
async function open(){ ALL=await api?.action('clip','list')||[]; sel=0; $('#q').value=''; render(); $('#q').focus(); const b=$('#box'); b.classList.remove('in'); void b.offsetWidth; b.classList.add('in'); }
api?.on('clip:show',open); open();
</script></body></html>
