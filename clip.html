<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="nova.css"><style>
  html,body{height:100%;overflow:hidden}
  body{padding:8px 10px 24px}
  .box{height:100%;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;isolation:isolate;position:relative}
  .box.in{animation:nv-pop .5s var(--jelly) both}
  .hero{margin:8px 8px 0;padding:14px 16px;border-radius:22px;gap:13px}
  .hero .tile{--ts:42px}
  .hero .hero-art{height:220%}
  .hero h1{font-size:24px}
  .top{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
  #q{all:unset;flex:1;height:38px;padding:0 14px;border-radius:13px;font:600 14px/1 var(--font);color:var(--fg);background:var(--field);box-shadow:inset 0 0 0 1px var(--fieldrim);-webkit-user-select:text}
  #q:focus{box-shadow:inset 0 0 0 1px rgba(0,194,255,.7),0 0 0 4px rgba(0,194,255,.16)}
  #q::placeholder{color:var(--mut)}
  .k{display:flex;align-items:center;gap:4px;font:650 11px/1 var(--body);color:var(--mut);white-space:nowrap}
  kbd{font:700 10.5px/1 var(--body);min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-grid;place-items:center;color:var(--tx2);background:rgba(255,255,255,.08);box-shadow:inset 0 -1px 0 rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.08)}
  .list{flex:1;overflow-y:auto;padding:4px 8px 6px;position:relative}
  .selbar{position:absolute;left:8px;right:8px;top:0;border-radius:14px;pointer-events:none;transition:transform .45s var(--jelly);
    background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent),color-mix(in srgb,var(--accent3) 10%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
  .it{position:relative;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;border-radius:14px;cursor:pointer;animation:nv-in .5s var(--jelly-soft) both;animation-delay:calc(var(--i,0)*24ms)}
  .it .n{width:16px;text-align:center;font:800 11px/1 var(--head);color:var(--mut)}
  .kd{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff;background:radial-gradient(120% 80% at 30% 0%,rgba(255,255,255,.5),transparent 50%),var(--kc);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px -4px var(--kc)}
  .kd svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 13px/1.3 var(--body);color:var(--tx2)}
  .t.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .t b{color:var(--fg);background:color-mix(in srgb,var(--accent) 26%,transparent);border-radius:4px;padding:0 2px}
  .it.sel .t{color:var(--fg)}
  .m{font:650 10.5px/1 var(--body);color:var(--mut)}
  .x{all:unset;cursor:pointer;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--mut);opacity:0}
  .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .it:hover .x,.it.sel .x{opacity:1}.x:hover{background:rgba(255,64,96,.25);color:#fff}
  .empty{padding:40px 10px;text-align:center;font:700 13px/1.4 var(--head);color:var(--mut)}
  .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 12px;border-top:1px solid var(--line);font:650 11.5px/1 var(--body);color:var(--mut)}
  .foot a{cursor:pointer;font-weight:750;color:var(--ink)}
</style><script src="nova.js"></script>
<link rel="stylesheet" href="maison.css"></head>
<body><div class="box surface h-cyan" id="box">
  <div class="hero mini h-cyan drag" data-glyph="clip"><div class="tile"></div><div class="htx"><span class="eyebrow">Clipboard history</span><h1>Paste anything again</h1></div></div>
  <div class="top"><input id="q" placeholder="Search your clipboard" autofocus><span class="k"><kbd>Return</kbd> paste <kbd>Cmd 1-9</kbd> quick <kbd>Esc</kbd> close</span></div>
  <div class="list" id="list"></div>
  <div class="foot"><span id="cnt"></span><a id="clear">Clear history</a></div>
</div>
<script>
const api=window.surge, $=s=>document.querySelector(s); $('.hero .tile').innerHTML=Nova.ic('clip'); Nova.upgrade(); let ALL=[], shown=[], sel=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mark(t,q){ const flat=t.replace(/\s+/g,' ').trim().slice(0,160); if(!q) return esc(flat); const i=flat.toLowerCase().indexOf(q); return i<0?esc(flat):esc(flat.slice(0,i))+'<b>'+esc(flat.slice(i,i+q.length))+'</b>'+esc(flat.slice(i+q.length)); }
const KIND={link:['Link','<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>','#00C2FF'],mail:['Email','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>','#FFA514'],color:['Colour','<circle cx="12" cy="12" r="8"/>','#fff'],num:['Number','<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>','#7B3DFF'],code:['Code','<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/>','#19D69A'],text:['Text','<path d="M5 7h14M5 12h14M5 17h9"/>','#FF2E8A']};
function kindOf(t){ const s=t.trim(); if(/^(https?:\/\/|www\.)\S+$/i.test(s)) return 'link'; if(/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(s)) return 'mail'; if(/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(s)||/^(rgb|hsl)a?\([^)]+\)$/i.test(s)) return 'color'; if(/^[-+]?[\d\s.,]+%?$/.test(s)&&/\d/.test(s)) return 'num'; if(/[{};]|=>|\b(function|const|let|import|def|class|return)\b|<\/?[a-z][^>]*>/.test(s)) return 'code'; return 'text'; }
function badge(t){ const k=kindOf(t), K=KIND[k]; return `<span class="kd${k==='color'?' sw':''}" style="--kc:${k==='color'?t.trim():K[2]}" title="${K[0]}">${k==='color'?'':`<svg viewBox="0 0 24 24">${K[1]}</svg>`}</span>`; }
function glide(){ const l=$('#list'), s=l.querySelector('.it.sel'); let g=l.querySelector('.selbar'); if(!s){ g&&g.remove(); return; } if(!g){ g=document.createElement('i'); g.className='selbar'; l.prepend(g); g.style.transition='none'; requestAnimationFrame(()=>requestAnimationFrame(()=>g.style.transition='')); } g.style.transform=`translateY(${s.offsetTop}px)`; g.style.height=s.offsetHeight+'px'; }
function render(){ const q=$('#q').value.trim().toLowerCase(); shown=q?ALL.filter(t=>t.toLowerCase().includes(q)):ALL.slice(); sel=Math.min(sel,Math.max(0,shown.length-1));
  $('#list').innerHTML=shown.length?shown.map((t,i)=>`<div class="it ${i===sel?'sel':''}" data-i="${i}" style="--i:${Math.min(i,14)}"><span class="n">${i<9?i+1:''}</span>${badge(t)}<span class="t ${kindOf(t)==='code'?'mono':''}">${mark(t,q)}</span><span class="m">${t.length>160?t.length+' chars':''}</span><button class="x" data-x="${i}" title="Remove">${Nova.ic('x')}</button></div>`).join(''):`<div class="empty">${ALL.length?'Nothing matches. Try fewer letters.':'Copy something, then press Command Shift V to paste it again.'}</div>`;
  $('#cnt').textContent=ALL.length+(ALL.length===1?' item':' items')+', kept in memory only'; glide(); }
function paste(t){ if(t) api?.action('clip','paste',t); }
$('#list').onclick=async e=>{ const x=e.target.closest('[data-x]'); if(x){ ALL=await api?.action('clip','remove',shown[+x.dataset.x])||[]; render(); return; } const it=e.target.closest('.it'); if(it) paste(shown[+it.dataset.i]); };
$('#q').oninput=()=>{ sel=0; render(); }; let undoT=0; $('#clear').onclick=async()=>{ const c=$('#clear'); if(c.dataset.undo){ const list=JSON.parse(c.dataset.undo); delete c.dataset.undo; clearTimeout(undoT); c.textContent='Clear history'; ALL=await api?.action('clip','restore',list)||list; render(); return; }
  const before=ALL.slice(); await api?.action('clip','clear'); ALL=[]; render(); if(!before.length) return; c.dataset.undo=JSON.stringify(before); c.textContent='Undo clear'; clearTimeout(undoT); undoT=setTimeout(()=>{ delete c.dataset.undo; c.textContent='Clear history'; },6000); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const q=document.getElementById('q'); if(q&&q.value){ q.value=''; q.dispatchEvent(new Event('input')); return; } api?.hide(); return; } if(e.key==='Enter'){ paste(shown[sel]); return; }
  if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)){ e.preventDefault(); paste(shown[+e.key-1]); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(0,Math.min(shown.length-1,sel+(e.key==='ArrowDown'?1:-1))); document.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('sel',i===sel)); document.querySelector('.it.sel')?.scrollIntoView({block:'nearest'}); glide(); } });
$('#list').addEventListener('mouseover',e=>{ const it=e.target.closest('.it'); if(!it||+it.dataset.i===sel) return; sel=+it.dataset.i; document.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('sel',i===sel)); glide(); });
async function open(){ ALL=await api?.action('clip','list')||[]; sel=0; $('#q').value=''; render(); $('#q').focus(); const b=$('#box'); b.classList.remove('in'); void b.offsetWidth; b.classList.add('in'); }
api?.on('clip:show',open); open();
</script></body></html>
