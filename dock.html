/* ---------- tooltip */

    el.onclick=()=>{ if(suppressClick) return; if(it.run) api?.appActivate(it.bundleId, it.path); else { launching.set(it.path,Date.now()); el.classList.add('launch'); api?.appOpen(it.path); } };

    el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); }; el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over'); const files=[...e.dataTransfer.files].map(f=>api?.pathFor?.(f)).filter(Boolean); if(files.length){ api?.appOpenWith?.(it.path,files); el.classList.add('launch'); setTimeout(()=>el.classList.remove('launch'),800); } };
    box.appendChild(el); });
  requestAnimationFrame(fit); }
/* ---------- magnification (macOS-style gaussian, lerped per frame) */
let mx=null, my=null, magT=null;

  if(any) magT=requestAnimationFrame(magLoop); else magT=null; }
function kick(){ if(!magT) magT=requestAnimationFrame(magLoop); }
addEventListener('mousemove',e=>{ const box=$('#apps'); if(!box) return; const r=box.getBoundingClientRect(); const inside=e.clientY>r.top-40&&e.clientY<r.bottom+6&&e.clientX>r.left-30&&e.clientX<r.right+30; mx=inside?e.clientX:null; my=e.clientY; kick(); if(dragging) dragMove(e); });
addEventListener('mouseleave',()=>{ mx=null; kick(); });
/* ---------- reorder by drag */
let dragging=null, dragStart=null, suppressClick=false;
document.addEventListener('mousedown',e=>{ if(e.button!==0) return; const a=e.target.closest('.ap'); if(!a) return; dragStart={x:e.clientX,y:e.clientY,el:a}; });
function dragMove(e){ const box=$('#apps'); const el=dragging; const others=[...box.querySelectorAll('.ap')].filter(x=>x!==el); let before=null; for(const o of others){ const r=o.getBoundingClientRect(); if(e.clientX<r.left+r.width/2){ before=o; break; } }
  if(before){ if(el.nextSibling!==before) box.insertBefore(el,before); } else if(box.lastElementChild!==el) box.appendChild(el); }
document.addEventListener('mousemove',e=>{ if(dragStart&&!dragging&&Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>8){ dragging=dragStart.el; dragging.classList.add('drag'); hideTip(); } });
document.addEventListener('mouseup',async()=>{ if(dragging){ const el=dragging; dragging=null; el.classList.remove('drag'); suppressClick=true; setTimeout(()=>suppressClick=false,250);
    const box=$('#apps'); const seq=[...box.querySelectorAll('.ap')].map(x=>x.dataset.path); const oldPins=S.modules?.dock?.pinned||[]; const me=el.dataset.path;
    // dropped left of the first running-only app → it becomes pinned at that spot; otherwise it's just a reorder of the pinned ones
    const firstUnpinned=seq.findIndex(p=>p!==me&&!oldPins.includes(p)); const mine=seq.indexOf(me);
    const becomesPinned=oldPins.includes(me)||firstUnpinned<0||mine<firstUnpinned;
    const pins=seq.filter(p=>oldPins.includes(p)||(p===me&&becomesPinned));
    lastAppsKey=''; await api?.setSettings({modules:{dock:{pinned:pins}}}); refreshApps(); }
  dragStart=null; });
/* ---------- context menu */
function openCtx(e,it,el){ const c=$('#ctx'); const pins=S.modules?.dock?.pinned||[]; const pinned=pins.includes(it.path);
  const rows=[['h',it.name],['Open'+(it.run?'':''),()=>el.click()],[pinned?'Unpin from Dock':'Keep in Dock',async()=>{ lastAppsKey=''; await api?.action('dock','pin',it.path); refreshApps(); }],['Show in Finder',()=>api?.appReveal?.(it.path)]];
  if(it.run){ rows.push(['sep']); rows.push(['Quit',()=>api?.appQuit(it.bundleId,it.pid),'']); rows.push(['Force Quit',()=>api?.appForceQuit?.(it.pid),'red']); }
  c.innerHTML=rows.map(r=>r[0]==='h'?`<div class="h">${r[1]}</div>`:r[0]==='sep'?'<div class="sep"></div>':`<div class="it ${r[2]||''}">${r[0]}</div>`).join('');
  const acts=rows.filter(r=>r[0]!=='h'&&r[0]!=='sep'); c.querySelectorAll('.it').forEach((n,i)=>n.onclick=()=>{ closeCtx(); acts[i][1](); });
  c.style.display='block'; const w=c.offsetWidth,h=c.offsetHeight; const r=(el.querySelector('.ic')||el).getBoundingClientRect(); let x=r.left+r.width/2-w/2; x=Math.max(6,Math.min(innerWidth-w-6,x)); const top=document.body.classList.contains('top'); c.style.left=x+'px'; c.style.top=(top?r.bottom+8:Math.max(4,r.top-h-10))+'px'; }
function closeCtx(){ $('#ctx').style.display='none'; }
document.addEventListener('mousedown',e=>{ if(!e.target.closest('#ctx')) closeCtx(); });
document.addEventListener('mouseleave',closeCtx);
addEventListener('blur',closeCtx);
/* ---------- click-through everywhere except the pill / menu */
let overDock=false; function setOver(v){ if(v===overDock) return; overDock=v; api?.action('dock','hover',v); }
document.addEventListener('mousemove',e=>setOver(!!(e.target.closest('#dock')||e.target.closest('#ctx')||dragging||$('#ctx').style.display==='block')));
document.addEventListener('mouseleave',()=>{ if(!dragging) setOver(false); });
/* ---------- widgets */
function tpl(id){
  switch(id){
    case 'apps': return `<div class="w apps" data-w="apps" id="apps"></div>`;
    case 'clock': return `<div class="w clock" data-w="clock" id="wclock" data-tip="Open Calendar"><div class="v" id="clk">--:--</div><div class="d" id="date"></div></div>`;
    case 'battery': return `<div class="w bat" data-w="battery"><div class="cell" id="cell"><i id="cfill"><svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 20V10Q12.5 0 25 10T50 10T75 10T100 10T125 10T150 10T175 10T200 10V20Z"/></svg></i><b id="bpct">—</b><em class="cbolt"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></em></div><div class="l" id="bst">Battery</div></div>`;
    case 'stats': return `<div class="w stats" data-w="stats"><canvas id="sc" width="140" height="80"></canvas><div class="n"><span>CPU <b id="cpu">—</b></span><span>MEM <b id="mem">—</b></span></div></div>`;
    case 'media': return `<div class="w media" data-w="media"><div class="art" id="art"><svg viewBox="0 0 24 24">${ICON.music}</svg></div><div class="t"><b id="mname">Nothing playing</b><small id="martist">Spotify / Music</small></div><div class="c"><button data-m="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6 9 12l11 6z"/></svg></button><button data-m="play"><svg viewBox="0 0 24 24" id="playIc"><path d="M7 5l12 7-12 7z"/></svg></button><button data-m="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg></button></div></div>`;
    case 'volume': return `<div class="w vol" data-w="volume" id="wvol" data-tip="Scroll to adjust · click icon to mute"><svg class="i" id="volIc" viewBox="0 0 24 24">${ICON.vol}</svg><input type="range" id="vol" min="0" max="100" step="1"><span id="volv" style="width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums">—</span></div>`;
    case 'focus': return `<div class="w btn" data-w="focus" id="wfocus"><svg class="i" viewBox="0 0 24 24">${ICON.focus}</svg><div class="v" id="ftime" style="font-size:14px">Focus</div></div>`;
    case 'caffeine': return `<div class="w btn" data-w="caffeine" id="wcaf"><svg class="i" viewBox="0 0 24 24">${ICON.caffeine}</svg><div class="l" id="caft">Caffeine</div></div>`;
    case 'glow': return `<div class="w btn" data-w="glow"><svg class="i" viewBox="0 0 24 24">${ICON.glow}</svg><div class="l">Glow</div></div>`;
    case 'notes': return `<div class="w btn" data-w="notes"><svg class="i" viewBox="0 0 24 24">${ICON.notes}</svg><div class="l">Notes</div></div>`;
    case 'spotlight': return `<div class="w btn" data-w="spotlight"><svg class="i" viewBox="0 0 24 24">${ICON.spotlight}</svg><div class="l">Spotlight</div></div>`;
    case 'launchpad': return `<div class="w btn" data-w="launchpad" data-tip="All apps  ⌘⇧L"><svg class="i" viewBox="0 0 24 24">${ICON.grid}</svg><div class="l">Apps</div></div>`;
  } return '';
}
function setVol(v){ v=Math.max(0,Math.min(100,Math.round(v))); const el=$('#vol'); if(!el) return; el.value=v; el.style.setProperty('--p',v+'%'); $('#volv').textContent=v; $('#wvol').classList.toggle('muted',v===0); $('#volIc').innerHTML=v===0?ICON.mute:ICON.vol; volDrag=true; clearTimeout(volT); volT=setTimeout(()=>{ api?.action('dock','volume',v); volDrag=false; },90); }
function build(){ const ws=(S.modules?.dock?.widgets)||[]; order=ws; $('#dock').innerHTML = ws.length ? ws.map(tpl).join('') : `<div class="empty">Pick widgets in Settings → Surge Dock</div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>api?.action('dock','media',b.dataset.m));
  const v=$('#vol'); if(v){ v.oninput=()=>setVol(+v.value); $('#wvol').onwheel=e=>{ e.preventDefault(); setVol(+v.value-Math.sign(e.deltaY+e.deltaX)*3); }; $('#volIc').onclick=()=>{ const cur=+v.value; if(cur>0){ lastVol=cur; setVol(0); } else setVol(lastVol||50); }; }
  $('#wclock')&&!WINOS&&($('#wclock').onclick=()=>api?.appOpen('/System/Applications/Calendar.app')); if(WINOS&&$('#wclock')) $('#wclock').removeAttribute('data-tip');
  $('#wfocus')&&($('#wfocus').onclick=async()=>{ const f=D.focus; if(!D.focusOn) await api?.setSettings({modules:{focus:{enabled:true}}}); await api?.action('focus', f&&f.phase!=='idle'?'stop':'start'); });
  $('#wcaf')&&($('#wcaf').onclick=async()=>{ if(!S.modules?.caffeine?.enabled) await api?.setSettings({modules:{caffeine:{enabled:true}}}); await api?.action('caffeine','toggle'); });
  document.querySelector('[data-w="glow"]')&&(document.querySelector('[data-w="glow"]').onclick=()=>api?.preview('preview'));
  document.querySelector('[data-w="notes"]')&&(document.querySelector('[data-w="notes"]').onclick=()=>api?.toggleNotes());
  document.querySelector('[data-w="launchpad"]')&&(document.querySelector('[data-w="launchpad"]').onclick=()=>api?.action('dock','launchpad'));
  document.querySelector('[data-w="spotlight"]')&&(document.querySelector('[data-w="spotlight"]').onclick=async()=>{ if(!S.modules?.spotlight?.enabled) await api?.setSettings({modules:{spotlight:{enabled:true}}}); api?.action('spotlight','toggle'); });
  refreshApps(); requestAnimationFrame(fit); }
function fit(){ const r=$('#dock').getBoundingClientRect(); api?.action('dock','rect',{l:r.left,t:r.top,w:r.width,h:r.height}); const n=document.querySelectorAll('.ap').length; const need=Math.ceil(r.width+40+(n?140:0)); if(Math.abs(need-innerWidth)>60||need>innerWidth) api?.action('dock','resize',need); }
function paintSettings(){ const d=S.modules?.dock||{}; document.body.classList.toggle('top',d.edge==='top'); document.body.style.alignItems=d.edge==='top'?'flex-start':'flex-end'; document.body.style.padding=d.edge==='top'?'6px 12px 0':'0 12px 6px'; $('#dock').style.zoom=d.size||1; }
function clock(){ const n=new Date(); const c=$('#clk'); if(c){ const t=n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); c.innerHTML=t.replace(':','<i>:</i>'); $('#date').textContent=n.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}); } }
function paint(){
  const b=D.battery; if(b&&$('#bpct')){ $('#bpct').textContent=b.level; $('#cfill').style.height=Math.max(8,b.level)+'%'; $('#cell').style.setProperty('--tc',b.charging?'var(--a)':b.level<=20?'#FF5C5C':'#6FA8FF'); $('#cell').classList.toggle('chg',!!b.charging); $('#bst').textContent=b.charged?'Full':b.holding?'On hold':b.charging?(b.remaining?b.remaining+' to full':'Charging'):b.remaining?b.remaining+' left':'Battery'; }
  if(b) $('#dock').classList.toggle('charging',!!b.charging&&!b.charged);
  if(D.stats&&$('#cpu')){ $('#cpu').textContent=Math.round(D.stats.cpu*100)+'%'; $('#mem').textContent=Math.round(D.stats.mem*100)+'%'; hist.push(D.stats.cpu); if(hist.length>30) hist.shift(); const c=$('#sc'), x=c.getContext('2d'); x.clearRect(0,0,140,80); x.beginPath(); hist.forEach((v,i)=>{ const px=i/(29)*140, py=80-v*72-4; i?x.lineTo(px,py):x.moveTo(px,py); }); x.strokeStyle='#00FF85'; x.lineWidth=3; x.lineJoin='round'; x.stroke(); x.lineTo(140,80); x.lineTo(0,80); x.closePath(); const g=x.createLinearGradient(0,0,0,80); g.addColorStop(0,'rgba(0,255,133,.35)'); g.addColorStop(1,'rgba(0,255,133,0)'); x.fillStyle=g; x.fill(); }
  if($('#mname')){ const m=D.media; $('#mname').textContent=m?m.name:'Nothing playing'; $('#martist').textContent=m?m.artist+' · '+m.app:'Spotify / Music'; $('#art').innerHTML=m&&m.playing?'<div class="bars"><i></i><i></i><i></i></div>':`<svg viewBox="0 0 24 24">${ICON.music}</svg>`; $('#playIc').innerHTML=m&&m.playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M7 5l12 7-12 7z"/>'; }
  if($('#vol')&&D.volume!=null&&!volDrag){ const v=D.volume; $('#vol').value=v; $('#vol').style.setProperty('--p',v+'%'); $('#volv').textContent=v; $('#wvol').classList.toggle('muted',v===0); $('#volIc').innerHTML=v===0?ICON.mute:ICON.vol; if(v>0) lastVol=v; }
  if($('#ftime')){ const f=D.focus; const on=f&&f.phase!=='idle'; $('#ftime').textContent=on?`${f.mm}:${f.ss}`:'Focus'; $('#wfocus').classList.toggle('live',!!on); $('#wfocus').classList.toggle('on',!!on&&f.phase==='work'); }
  if($('#caft')){ const c=D.caffeine; $('#caft').textContent=c&&c.on?(c.left!=null?`${c.left}m`:'Awake'):'Caffeine'; $('#wcaf').classList.toggle('on',!!(c&&c.on)); }
}
(async()=>{ S=await api?.getSettings()||{}; paintSettings(); build(); api?.appsInstalled?.().then(l=>{ (l||[]).forEach(a=>NAMES[a.path]=a.name); lastAppsKey=''; refreshApps(); }); clock(); setInterval(clock,1000);
  api?.on('settings:update',s=>{ const before=JSON.stringify(S.modules?.dock?.widgets); S=s; paintSettings(); if(JSON.stringify(S.modules?.dock?.widgets)!==before) build(); else { lastAppsKey=''; refreshApps(); fit(); } });
  api?.on('dock:hidden',()=>{ overDock=false; closeCtx(); hideTip(); mx=null; kick(); });
  api?.on('dock:data',d=>{ D=d; paint(); refreshApps(); }); setInterval(refreshApps,1500); })();
</script>
</body></html>
