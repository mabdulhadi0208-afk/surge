<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="maison.css">
<style>
  /* ═══ Surge Dock 3.1, Maison. Solid paper (light) or ink (dark) islands with one hairline and one modest shadow, emerald
     for what is live, Geist type. Magnification is transform only (no layout per frame): icons swell from their base, the
     neighbours slide apart, the shelf stretches under them, and every spring stops once it settles. Nothing loops. ═══ */
  :root{--slot:50px;--icon:44px;--isle:64px;--r:20px;--shelf:var(--m-card);--shelf-line:var(--m-line);--shelf-sh:0 14px 34px -18px rgba(21,19,15,.45);--w-ease:cubic-bezier(.2,.8,.2,1)}

  body{display:flex;align-items:flex-end;justify-content:center;padding:0 12px 6px}
  body.top{align-items:flex-start}
  .dock{position:relative;display:flex;align-items:flex-end;gap:8px;padding:0;transform-origin:50% 100%}
  body.top .dock{transform-origin:50% 0;align-items:flex-start}
  .dock.enter{animation:dockIn .5s var(--w-ease) both} body.top .dock.enter{animation-name:dockInTop}
  @keyframes dockIn{from{opacity:0;transform:translateY(18px)}} @keyframes dockInTop{from{opacity:0;transform:translateY(-18px)}}
  /* islands: every widget is its own small card */
  .w{position:relative;flex:none;height:var(--isle);min-width:var(--isle);padding:8px 12px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:var(--shelf);box-shadow:inset 0 0 0 1px var(--shelf-line),var(--shelf-sh);cursor:default;transition:transform .45s var(--w-ease);isolation:isolate;overflow:hidden}
  .w>*{position:relative;z-index:1}
  .w.wb{cursor:pointer}
  .w.wb:active{transform:scale(.95);transition-duration:.12s}
  .w .l{font-size:10.5px;font-weight:550;color:var(--m-fg2);white-space:nowrap;letter-spacing:0}
  .w .v{font-size:15px;font-weight:600;letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .w svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  /* the flow hover on every widget you can press: ink flows in from where the pointer entered, the label and icon flip */
  .w.wb,.w.fl{--flow:var(--m-solid);--flow-fg:var(--m-on-solid);transition:color 0s linear .1s,transform .45s var(--w-ease)}

  .w.wb:hover::before,.w.fl:hover::before{transform:translate(-50%,-50%) scale(1)}
  .w.wb:hover,.w.fl:hover{color:var(--flow-fg)} .w.wb:hover .l,.w.fl:hover .l,.w.fl:hover .d,.w.fl:hover .dm{color:var(--flow-fg)}
  .w.on{--flow:var(--m-acc);--flow-fg:#fff;background:var(--m-acc);color:#fff;box-shadow:var(--shelf-sh)} .w.on .l{color:rgba(255,255,255,.82)}
  .w.live{box-shadow:inset 0 0 0 1.5px var(--m-acc),var(--shelf-sh)} .w.live .v{color:var(--m-acc-ink)} .w.live:hover .v{color:inherit}
  /* apps: the shelf is drawn by #shelf, which stretches (scaleX) as icons magnify; the icons are placed by transform */
  .apps{height:var(--isle);min-width:0;padding:0 8px;flex-direction:row;align-items:flex-end;gap:0;background:transparent;box-shadow:none;overflow:visible;isolation:auto}
  #shelf{position:absolute;inset:0;z-index:0;border-radius:var(--r);background:var(--shelf);box-shadow:inset 0 0 0 1px var(--shelf-line),var(--shelf-sh);transform-origin:50% 50%;pointer-events:none}
  .ap{position:relative;z-index:1;width:var(--slot);height:var(--isle);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9px;cursor:pointer;flex:none}
  .ap .ic{width:var(--icon);height:var(--icon);border-radius:11px;transform-origin:50% 100%;position:relative;overflow:hidden;background:var(--m-bg3);box-shadow:0 1px 2px rgba(0,0,0,.18)}
  body.top .ap{justify-content:flex-start;padding:7px 0 0} body.top .ap .ic{transform-origin:50% 0}
  .ap .ic img{width:100%;height:100%;display:block;pointer-events:none}
  .ap .ic.ph{display:grid;place-items:center;font:600 18px/1 var(--m-font);color:var(--m-fg2)}
  .ap:active .ic{filter:brightness(.8)}

  body.top .ap .dot{bottom:auto;top:auto;bottom:2px}
  .ap.run .dot{opacity:1} .ap.front .dot{background:var(--m-acc-ink);width:12px;margin-left:-6px;border-radius:2px;height:3px}
  .ap.launch .ic{animation:launch 1s var(--w-ease)} @keyframes launch{0%,100%{translate:0 0}22%{translate:0 -16px}44%{translate:0 0}62%{translate:0 -7px}80%{translate:0 0}}
  .ap.fresh .ic{animation:apFresh .45s var(--w-ease) backwards} @keyframes apFresh{from{opacity:0;scale:.6}}
  .ap.drag{z-index:5} .ap.drag .ic{opacity:.9;scale:1.08;box-shadow:0 10px 24px -8px rgba(0,0,0,.55)}

    opacity:0;pointer-events:none;transform:translate(-50%,4px);transition:opacity .14s,transform .3s var(--w-ease)}
  #tip.on{opacity:1;transform:translate(-50%,0)}
  #tip small{font-weight:450;opacity:.65;margin-left:6px;font-size:11px}
  /* right-click menu: a paper card, items flow to ink */
  #ctx{position:fixed;display:none;z-index:20;min-width:180px;padding:5px;border-radius:12px;background:var(--m-card);box-shadow:0 0 0 1px var(--m-line),var(--m-float);transform-origin:50% 100%;animation:ctxIn .2s var(--w-ease)}
  @keyframes ctxIn{from{opacity:0;transform:translateY(6px) scale(.97)}}
  #ctx .h{padding:7px 10px 5px;font:600 11px/1 var(--m-font);color:var(--m-fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  #ctx .it{position:relative;isolation:isolate;overflow:hidden;padding:8px 10px;border-radius:8px;cursor:pointer;font:500 13px/1 var(--m-font);color:var(--m-fg);display:flex;justify-content:space-between;gap:18px;white-space:nowrap;
    --flow:var(--m-solid);--flow-fg:var(--m-on-solid);transition:color 0s linear .1s}
  #ctx .it::before{content:"";position:absolute;z-index:-1;left:var(--fx,50%);top:var(--fy,50%);width:260%;aspect-ratio:1;border-radius:50%;background:var(--flow);transform:translate(-50%,-50%) scale(0);transition:transform .42s var(--w-ease)}
  #ctx .it:hover::before{transform:translate(-50%,-50%) scale(1)} #ctx .it:hover{color:var(--flow-fg)}
  #ctx .it.red{color:var(--m-danger);--flow:var(--m-danger);--flow-fg:#fff} @media (prefers-color-scheme:dark){#ctx .it.red{color:#e58a93}} #ctx .it.red:hover{color:#fff}
  #ctx .it kbd{all:unset;font:500 11px/1 var(--m-font);color:var(--m-fg3)} #ctx .it:hover kbd{color:inherit;opacity:.75}
  #ctx .sep{height:1px;background:var(--m-line);margin:4px 8px}
  .empty{padding:14px 18px;color:var(--m-fg2);font-weight:500}
  #dtoast{position:fixed;z-index:15;display:flex;align-items:center;gap:12px;padding:5px 5px 5px 13px;border-radius:10px;font:500 12.5px/1 var(--m-font);color:var(--m-on-solid);background:var(--m-solid);box-shadow:0 8px 20px -10px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transform:translate(-50%,6px);transition:opacity .18s,transform .4s var(--w-ease)}
  #dtoast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #dtoast button{all:unset;position:relative;isolation:isolate;overflow:hidden;cursor:pointer;padding:6px 10px;border-radius:7px;font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--m-on-solid) 35%,transparent);--flow:var(--m-acc);--flow-fg:#fff;transition:color 0s linear .1s}
  #dtoast button::before{content:"";position:absolute;z-index:-1;left:var(--fx,50%);top:var(--fy,50%);width:260%;aspect-ratio:1;border-radius:50%;background:var(--flow);transform:translate(-50%,-50%) scale(0);transition:transform .42s var(--w-ease)}
  #dtoast button:hover::before{transform:translate(-50%,-50%) scale(1)} #dtoast button:hover{color:var(--flow-fg)}
  /* clock: a small paper dial and the time */
  .clock{flex-direction:row;gap:10px;padding:8px 14px 8px 10px}
  .clock .ct{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .clock .v{font-size:19px;font-weight:600;letter-spacing:-.4px} .clock .d{font-size:10.5px;color:var(--m-fg2)}
  .dial{position:relative;width:38px;height:38px;border-radius:50%;flex:none;background:var(--m-bg);box-shadow:inset 0 0 0 1px var(--m-line2)}
  .dial::before{content:"";position:absolute;inset:3px;border-radius:50%;background:conic-gradient(from -1.5deg,var(--m-fg3) 0 3deg,transparent 3deg 90deg,var(--m-fg3) 90deg 93deg,transparent 93deg 180deg,var(--m-fg3) 180deg 183deg,transparent 183deg 270deg,var(--m-fg3) 270deg 273deg,transparent 273deg);-webkit-mask:radial-gradient(closest-side,transparent 80%,#000 82%)}
  .dial::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--m-acc-ink);z-index:3}
  .dial i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:2px;transition:transform .5s var(--w-ease)}
  .dial .hh{width:2.5px;height:9px;margin-left:-1.25px;background:var(--m-fg)} .dial .mh{width:1.5px;height:13px;margin-left:-.75px;background:var(--m-fg)} .dial .sh{width:1px;height:15px;margin-left:-.5px;background:var(--m-acc-ink)}
  .clock:hover .dial{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--flow-fg) 40%,transparent)} .clock:hover .dial .hh,.clock:hover .dial .mh{background:var(--flow-fg)}
  /* date: a paper calendar leaf */
  .datew{min-width:62px;padding:0;justify-content:flex-start;gap:0}
  .datew .dw{width:100%;text-align:center;font-size:9.5px;font-weight:650;letter-spacing:.08em;color:var(--m-acc-ink);padding:8px 0 0}
  .datew .dn{font:400 27px/1 var(--m-serif);margin-top:1px;font-variant-numeric:tabular-nums} .datew .dm{font-size:9.5px;color:var(--m-fg2);margin-top:1px;line-height:1.1}
  .datew:hover .dw{color:var(--flow-fg)}
  /* battery: a slim cell that fills; emerald while charging, a warm red when low */
  .bat{min-width:66px;gap:5px}
  .cell{position:relative;width:40px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--m-fg3);display:grid;place-items:center;overflow:hidden;--tc:var(--m-fg2)}
  .cell::after{content:"";position:absolute;right:-4px;top:7px;width:2px;height:8px;border-radius:0 2px 2px 0;background:var(--m-fg3)}
  .bat{overflow:visible}
  .cell i{position:absolute;left:3px;top:3px;bottom:3px;width:calc(100% - 6px);border-radius:3px;background:var(--tc);transform-origin:0 50%;transform:scaleX(var(--lv,.5));transition:transform 1s var(--w-ease)}
  .cell b{position:relative;z-index:1;font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--m-fg);mix-blend-mode:normal}
  .cell.full b,.cell.chg b{color:#fff}
  .cell .cbolt{display:none}
  /* stats */
  .stats{min-width:112px;flex-direction:row;gap:10px} .stats canvas{width:56px;height:32px} .stats .n{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--m-fg2);font-variant-numeric:tabular-nums} .stats .n b{color:var(--m-fg);font-size:13px;font-weight:600}
  /* now playing */
  .media{min-width:206px;flex-direction:row;gap:10px;padding:8px 10px}
  .media .art{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--m-bg3);color:var(--m-fg2)}
  .media.playing .art{background:var(--m-acc);color:#fff}
  .media .art svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .media .t{display:flex;flex-direction:column;min-width:0;flex:1} .media .t b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px} .media .t small{color:var(--m-fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .media .c{display:flex;gap:2px}
  .media .c button{all:unset;position:relative;isolation:isolate;overflow:hidden;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--m-fg);--flow:var(--m-solid);--flow-fg:var(--m-on-solid);transition:color 0s linear .1s}
  .media .c button::before{content:"";position:absolute;z-index:-1;left:var(--fx,50%);top:var(--fy,50%);width:260%;aspect-ratio:1;border-radius:50%;background:var(--flow);transform:translate(-50%,-50%) scale(0);transition:transform .42s var(--w-ease)}
  .media .c button:hover::before{transform:translate(-50%,-50%) scale(1)} .media .c button:hover{color:var(--flow-fg)} .media .c button:active{transform:scale(.9)}
  .media .c svg{width:13px;height:13px;fill:currentColor}
  /* volume */
  .vol{min-width:150px;flex-direction:row;gap:9px} .vol svg.i{width:18px;height:18px;cursor:pointer} .vol.muted svg.i{color:var(--m-fg3)}
  .vol #volv{width:24px;text-align:right;color:var(--m-fg2);font-variant-numeric:tabular-nums;font-size:11.5px}
  input[type=range]{-webkit-appearance:none;width:86px;height:4px!important;border-radius:3px;background:linear-gradient(90deg,var(--m-acc) var(--p,50%),var(--m-bg3) var(--p,50%))!important;outline:none;cursor:pointer;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px!important;height:14px!important;border-radius:50%;background:var(--m-card)!important;box-shadow:0 0 0 1px var(--m-line2),0 1px 3px rgba(0,0,0,.35)!important}
  /* styles: pill puts everything on one shelf, floating icons drops the shelf */
  body.look-pill .dock{gap:2px;padding:0 4px;border-radius:calc(var(--r) + 2px);background:var(--shelf);box-shadow:inset 0 0 0 1px var(--shelf-line),var(--shelf-sh)}
  body.look-pill .w{box-shadow:none;background:transparent} body.look-pill .w.on{background:var(--m-acc)} body.look-pill #shelf{display:none}
  body.look-float .w{box-shadow:inset 0 0 0 1px var(--shelf-line)} body.look-float #shelf{display:none} body.look-float .ap .ic{box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
  .w.live #ftime{font-size:14px;font-weight:600;color:var(--m-acc-ink);font-variant-numeric:tabular-nums} .w.on #ftime{color:#fff}
  body.no-labels .w .l:not(#ftime){display:none} body.no-labels .w.wb{min-width:var(--isle)}
  @media (prefers-reduced-motion:reduce){.dock.enter,.ap.launch .ic,.ap.fresh .ic,#ctx{animation:none!important}.w,.w::before,.dial i,.cell i,#tip{transition:none!important}}
</style>

<script>

/* ---------- context menu */
function openCtx(e,it,el){ hideTip(); const c=$('#ctx'); const pins=S.modules?.dock?.pinned||[]; const pinned=pins.includes(it.path);

/* ---------- 3.1: an Undo toast over the apps (removing an app from the Dock can be undone for 6 s) */
let dtT=0; function dtoast(msg, undo){ hideTip(); const t=$('#dtoast'); $('#dtMsg').textContent=msg; $('#dtUndo').onclick=()=>{ hideDt(); undo&&undo(); }; const r=($('#apps')||$('#dock')).getBoundingClientRect(); t.style.left=(r.left+r.width/2)+'px'; t.style.top=(document.body.classList.contains('top')?r.bottom+10:r.top-44)+'px'; t.classList.add('on'); clearTimeout(dtT); dtT=setTimeout(hideDt,6000); }

/* ---------- widgets */
function tpl(id){

function setVol(v){ v=Math.max(0,Math.min(100,Math.round(v))); const el=$('#vol'); if(!el) return; el.value=v; el.style.setProperty('--p',v+'%'); $('#volv').textContent=v; $('#wvol').classList.toggle('muted',v===0); $('#volIc').innerHTML=v===0?ICON.mute:ICON.vol; volDrag=true; clearTimeout(volT); volT=setTimeout(()=>{ api?.action('dock','volume',v); volDrag=false; },90); }

  $('#wcaf')&&($('#wcaf').onclick=async()=>{ if(!S.modules?.caffeine?.enabled) await api?.setSettings({modules:{caffeine:{enabled:true}}}); await api?.action('caffeine','toggle'); });
  document.querySelector('[data-w="glow"]')&&(document.querySelector('[data-w="glow"]').onclick=()=>api?.preview('preview'));
  document.querySelector('[data-w="notes"]')&&(document.querySelector('[data-w="notes"]').onclick=()=>api?.toggleNotes());
  document.querySelector('[data-w="launchpad"]')&&(document.querySelector('[data-w="launchpad"]').onclick=()=>api?.action('dock','launchpad'));
  document.querySelector('[data-w="spotlight"]')&&(document.querySelector('[data-w="spotlight"]').onclick=async()=>{ if(!S.modules?.spotlight?.enabled) await api?.setSettings({modules:{spotlight:{enabled:true}}}); api?.action('spotlight','toggle'); });

function paintSettings(){ const d=S.modules?.dock||{}; const look=d.look||'islands'; for(const k of ['islands','pill','float']) document.body.classList.toggle('look-'+k,look===k); document.body.classList.toggle('no-aura',d.aura===false); document.body.classList.toggle('reflect',d.reflect!==false); document.body.classList.toggle('no-labels',d.labels===false); requestAnimationFrame(fit); document.body.classList.toggle('top',d.edge==='top'); document.body.style.alignItems=d.edge==='top'?'flex-start':'flex-end'; document.body.style.padding=d.edge==='top'?'6px 12px 0':'0 12px 6px'; const zz=String((d.size||1)*BASE); if($('#dock').style.zoom!==zz){ $('#dock').style.zoom=zz; rest=null; } }

  const b=D.battery; if(b&&$('#bpct')){ $('#bpct').textContent=b.level; $('#cell').style.setProperty('--lv',Math.max(.06,b.level/100)); $('#cell').style.setProperty('--tc',b.charging?'var(--m-acc)':b.level<=20?'var(--m-danger)':'var(--m-fg3)'); $('#cell').classList.toggle('chg',!!b.charging); $('#cell').classList.toggle('full',!b.charging&&b.level>=55); $('#bst').textContent=b.charged?'Full':b.holding?'On hold':b.charging?(b.remaining?b.remaining+' to full':'Charging'):b.remaining?b.remaining+' left':'Battery'; }

}
(async()=>{ S=await api?.getSettings()||{}; paintSettings(); build(); api?.appsInstalled?.().then(l=>{ (l||[]).forEach(a=>NAMES[a.path]=a.name); lastAppsKey=''; refreshApps(); }); clock(); setInterval(clock,1000);
