<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root{--a:#00FF85;--b:#39FF14;--ink:#f2f2f6;--muted:#9a9aa6;--line:rgba(255,255,255,.09);--spring:cubic-bezier(.34,1.56,.64,1);--flow:cubic-bezier(.2,.8,.2,1);--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:transparent;font:13px/1.4 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;overflow:hidden}
  body.bottom .arrow{top:auto;bottom:2px;transform:translateX(-50%) rotate(225deg)} body.bottom .panel{transform-origin:50% 100%}
  .arrow{position:absolute;top:2px;left:50%;width:16px;height:16px;background:rgba(18,18,24,.92);transform:translateX(-50%) rotate(45deg);border-radius:3px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .panel{position:absolute;left:8px;right:8px;top:10px;bottom:8px;border-radius:20px;background:rgba(18,18,24,.92);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.04) inset;overflow:hidden;display:flex;flex-direction:column;transform-origin:50% 0;animation:pop .45s var(--spring) both}
  @keyframes pop{from{opacity:0;transform:scale(.92) translateY(-10px)}}
  .aura{position:absolute;inset:-40%;filter:blur(70px);opacity:.14;background:conic-gradient(from 0deg,var(--a),var(--b),#7A5CFF,var(--a));pointer-events:none;animation:spin 30s linear infinite} @keyframes spin{to{transform:rotate(1turn)}}
  .panel>*{position:relative}
  header{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
  .ring{position:relative;width:52px;height:52px;flex:none} .ring svg{width:52px;height:52px;transform:rotate(-90deg)} .ring .bg{stroke:rgba(255,255,255,.1)} .ring .fg{stroke:var(--a);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--a));transition:stroke-dashoffset .8s var(--ease)}
  .ring .bolt{position:absolute;inset:0;display:grid;place-items:center} .ring .bolt svg{width:16px;transform:none;fill:#fff}
  .ht{display:flex;flex-direction:column;gap:2px;min-width:0} .ht b{font-size:18px;font-weight:700;letter-spacing:-.3px} .ht small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ht .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--a);margin-top:3px} .ht .pill i{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a)}
  .grow{flex:1}
  .ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:transform .35s var(--spring),background .2s} .ib:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)} .ib:active{transform:scale(.92)} .ib svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .sec{padding:4px 16px 0;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 16px 4px}
  .m{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:transform .35s var(--spring),background .25s,border-color .25s,box-shadow .3s;position:relative}
  .m svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
  .m span{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .m:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)} .m:active{transform:scale(.93)}
  .m.on{background:rgba(0,255,133,.1);border-color:rgba(0,255,133,.4);box-shadow:0 0 18px -6px var(--a)} .m.on svg{stroke:var(--a)} .m.on span{color:var(--ink)}
  .m.need::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#FFB300}
  .vol{display:flex;align-items:center;gap:10px;padding:10px 16px 4px} .vol svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;cursor:pointer}
  input[type=range]{-webkit-appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--a) var(--p,50%),rgba(255,255,255,.12) var(--p,50%));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .3s var(--spring)} input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
  .vol output{width:34px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px 10px}
  .q{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10.5px;color:var(--muted);transition:transform .35s var(--spring),background .25s} .q:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)} .q:active{transform:scale(.93)}
  .q svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} .q.hot{background:linear-gradient(135deg,rgba(0,255,133,.25),rgba(57,255,20,.1));border-color:rgba(0,255,133,.4);color:var(--ink)} .q.hot svg{stroke:var(--a)}
  .q.live{border-color:rgba(255,179,0,.5);color:#FFD37A} .q.live svg{stroke:#FFB300}
  @keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.86)}}
  .panel.show .m{animation:tileIn .55s var(--flow) backwards;animation-delay:calc(var(--i,0)*16ms)}
  .panel.show .q{animation:tileIn .55s var(--flow) backwards;animation-delay:calc(.26s + var(--i,0)*34ms)}
  .panel.show header{animation:tileIn .5s var(--flow) backwards}
  .upd.upd button{position:relative;overflow:hidden;isolation:isolate} .upd.upd button::before{content:"";position:absolute;left:50%;top:100%;width:190%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,0);transition:transform .6s var(--flow);z-index:-1}
  .upd.upd button:hover::before{transform:translate(-50%,-60%)}
  .upd{margin:4px 16px 0;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(0,255,133,.18),rgba(0,212,255,.08));border:1px solid rgba(0,255,133,.4);display:flex;align-items:center;gap:10px;font-size:12px;animation:pop .5s var(--spring)} .upd svg{width:16px;height:16px;stroke:var(--a);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none} .upd span{flex:1} .upd button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;background:var(--a);color:#06110a;font-weight:700;font-size:11px}
  footer{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  footer a{cursor:pointer;padding:6px 10px;border-radius:9px;transition:background .2s} footer a:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .toast{position:absolute;left:50%;bottom:58px;transform:translate(-50%,20px);background:rgba(30,30,38,.95);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;opacity:0;transition:all .4s var(--spring);pointer-events:none} .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ───────── Surge look v3: "live current". One loud thing (the charge tank), everything else quiet tonal surfaces. ───────── */
  :root{--bg0:#0b0e15;--bg1:#131824;--bg2:#1b2232;--bg3:#252e42;--ink:#eef1f7;--muted:#8b94a7;--line:rgba(255,255,255,.07)}
  .arrow{background:var(--bg1);border-color:transparent}
  .panel{background:linear-gradient(180deg,var(--bg1),var(--bg0) 60%);border:0;border-radius:26px;box-shadow:0 34px 90px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.04);animation:pop .55s var(--flow) both}
  @keyframes pop{from{opacity:0;transform:scale(.86) translateY(-18px)}}
  .aura{display:none}
  .panel>*{flex:none}
  /* the charge tank */
  header{position:relative;margin:12px 12px 4px;padding:16px 14px 16px 18px;border-radius:20px;background:var(--bg2);overflow:hidden;--lv:50%;--tc:var(--a);gap:10px;isolation:isolate}
  .liq{position:absolute!important;left:0;top:0;bottom:0;width:var(--lv);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,transparent),color-mix(in srgb,var(--tc) 46%,transparent));transition:width 1.4s var(--flow),background .6s;z-index:-1}
  .liq .wave{position:absolute;left:100%;top:0;width:14px;height:400%;fill:color-mix(in srgb,var(--tc) 46%,transparent);animation:slosh 3.2s linear infinite;transition:fill .6s}
  @keyframes slosh{to{transform:translateY(-25%)}}
  .liq .bub{position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--tc) 70%,#fff);opacity:0}
  header.chg .bub{animation:bub 2.6s ease-in infinite} .bub:nth-child(2){left:18%} .bub:nth-child(3){left:42%;animation-delay:.7s!important;width:4px;height:4px} .bub:nth-child(4){left:66%;animation-delay:1.3s!important} .bub:nth-child(5){left:86%;animation-delay:1.9s!important;width:3px;height:3px}
  @keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-92px);opacity:0}}
  .ht b{font-size:34px;line-height:1;font-weight:750;letter-spacing:-1.4px;font-variant-numeric:tabular-nums} .ht small{font-size:12.5px;color:color-mix(in srgb,var(--ink) 78%,transparent);margin-top:3px}
  .ht .pill{color:var(--ink);opacity:.75;font-size:11px} .ht .pill i{background:var(--tc);box-shadow:0 0 8px var(--tc)}
  .ib{border:0;background:rgba(10,13,20,.42);border-radius:50%;width:36px;height:36px;backdrop-filter:blur(6px)} .ib:hover{background:rgba(10,13,20,.7);transform:translateY(-2px) scale(1.06)}
  /* quiet labels */
  .sec{text-transform:none;letter-spacing:0;font-size:12px;font-weight:650;color:var(--muted);padding:10px 18px 0}
  /* module tiles: icon in a disc, colour only when it is on */
  .grid{gap:6px;padding:8px 12px 2px}
  .m{border:0;background:transparent;border-radius:16px;padding:7px 2px 6px;gap:6px}
  .m svg{width:38px;height:38px;padding:10px;border-radius:50%;background:var(--bg2);stroke:var(--muted);transition:background .35s var(--flow),stroke .25s,box-shadow .4s,transform .45s var(--spring)}
  .m:hover{background:transparent;transform:none} .m:hover svg{transform:translateY(-3px) scale(1.08);background:var(--bg3)} .m:active svg{transform:scale(.88)}
  .m.on{background:transparent;border:0;box-shadow:none} .m.on svg{background:var(--a);stroke:#04140c;box-shadow:0 8px 20px -8px var(--a)}
  .m span{font-size:10px} .m.need::after{top:4px;right:9px;width:7px;height:7px;box-shadow:0 0 0 2px var(--bg0)}
  .vol{padding:12px 18px 6px} input[type=range]{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--a) var(--p,50%),var(--bg2) var(--p,50%))} input[type=range]::-webkit-slider-thumb{width:18px;height:18px}
  #chk{background:var(--bg1)!important;border:0!important;border-radius:14px!important;margin:4px 12px 0!important} #chkBtn{border-radius:999px!important;background:var(--bg3)!important}
  .quick{gap:6px;padding:8px 12px 12px} .q{border:0;background:var(--bg1);border-radius:16px;padding:12px 4px;transition:transform .45s var(--spring),background .3s} .q:hover{background:var(--bg2);transform:translateY(-3px)} .q.hot{background:color-mix(in srgb,var(--a) 20%,var(--bg1));border:0}
  .upd{border:0!important;border-radius:16px;margin:6px 12px 0;padding:11px 12px 11px 14px}
  footer{border-top:0;background:rgba(0,0,0,.22);padding:9px 14px 11px}
  .toast{background:var(--bg3);border:0}
  @media (prefers-reduced-motion:reduce){ .liq .wave,.bub,.panel.show .m,.panel.show .q{animation:none!important} }
</style></head>
<body>
<div class="arrow"></div>
<div class="panel">
  <div class="aura"></div>
  <header>
    <div class="liq" id="liq"><svg class="wave" viewBox="0 0 20 200" preserveAspectRatio="none"><path d="M0 0H10Q20 12.5 10 25T10 50T10 75T10 100T10 125T10 150T10 175T10 200H0Z"/></svg><i class="bub"></i><i class="bub"></i><i class="bub"></i><i class="bub"></i></div>
    <div class="ht"><b id="pct">—</b><small id="status">Reading battery…</small><span class="pill" id="live"><i></i><span id="liveT">0 modules on</span></span></div>
    <div class="grow"></div>
    <button class="ib" id="glowBtn" title="Preview glow"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="ib" id="gear" title="Settings (⌘,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="upd" id="snd" style="display:none;border-color:rgba(255,92,92,.5);background:linear-gradient(135deg,rgba(255,92,92,.18),rgba(255,92,92,.05))"><svg viewBox="0 0 24 24" style="stroke:#FF5C5C"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg><span id="sndT"></span><button id="sndBtn"></button></div>
  <div class="upd" id="ax" style="display:none;border-color:rgba(255,179,0,.5);background:linear-gradient(135deg,rgba(255,179,0,.18),rgba(255,122,0,.06))"><svg viewBox="0 0 24 24" style="stroke:#FFB300"><path d="M12 3v10M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg><span id="axT">Keyboard &amp; mouse need Accessibility</span><button id="axBtn" style="background:#FFB300">Allow</button></div>
  <div class="upd" id="upd" style="display:none"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span id="updT"></span><button id="updBtn">Restart</button></div>
  <div class="sec">Modules</div>
  <div class="grid" id="grid"></div>
  <div class="vol"><svg id="mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><input type="range" id="master" min="0" max="1" step=".01"><output id="mout">100%</output></div>
  <div id="chk" style="display:flex;align-items:center;gap:8px;margin:2px 16px 0;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:11.5px;color:var(--muted)"><span id="chkT" style="flex:1;line-height:1.35"></span><button id="chkBtn" style="all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--ink);font-weight:600;font-size:11.5px">Test sound</button></div>
  <div class="sec">Quick actions</div>
  <div class="quick">
    <button class="q" id="qCaf"><svg viewBox="0 0 24 24"><path d="M4 8h12v6a5 5 0 0 1-10 0z"/><path d="M16 9h2a2 2 0 1 1 0 4h-2M6 20h10"/></svg>Caffeine</button>
    <button class="q" id="qFocus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Focus</button>
    <button class="q" id="qSpot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Spotlight</button>
    <button class="q" id="qNotes"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Notes</button>
  </div>
  <footer><span id="clip">Clipboard: —</span><div class="grow"></div><a id="ver"></a><a id="quit">Quit</a></footer>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s), api=window.surge;
const ICONS={snap:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M12 12h9"/>',island:'<rect x="6" y="4" width="12" height="6" rx="3"/><path d="M4 15h16M7 19h10"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',keyboard:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>',mouse:'<rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v3"/>',ripple:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>',spot:'<circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',caps:'<path d="M12 4 4 12h5v8h6v-8h5z"/>',coffee:'<path d="M4 8h12v6a5 5 0 0 1-10 0z"/><path d="M16 9h2a2 2 0 1 1 0 4h-2M6 20h10"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V2h6v2"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',wifi:'<path d="M2 9a16 16 0 0 1 20 0M5 13a11 11 0 0 1 14 0M8.5 16.5a6 6 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/>',contrast:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/>',wpm:'<path d="M3 17l4-8 4 8 4-8 4 8"/>',keys:'<path d="M15 7a4 4 0 1 1-2.8 6.8L7 19H4v-3l5.2-5.2A4 4 0 0 1 15 7z"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',dock:'<rect x="2" y="15" width="20" height="6" rx="3"/><path d="M6 18h.01M10 18h.01M14 18h.01M18 18h.01"/>'};
let S={modules:{}}, MODS=[], hook='ready';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),900); }
function build(){ $('#grid').innerHTML=MODS.map(m=>`<button class="m ${m.needsHook&&hook!=='running'?'need':''}" data-m="${m.id}" title="${m.desc}"><svg viewBox="0 0 24 24">${ICONS[m.icon]||ICONS.bolt}</svg><span>${m.name.replace(' Sounds','').replace('Cursor ','').replace('Clipboard History','Clipboard').replace('Break Reminder','Breaks').replace('Auto Dark Mode','Dark Mode').replace('Typing Stats','Typing').replace('Caps Lock HUD','Caps').replace('Hourly Chime','Chime').replace('Charge Glow','Glow').replace('Network Glow','Network').replace('Click Ripple','Ripple').replace('System Stats','Stats').replace('Focus Timer','Focus').replace('Surge Dock','Dock').replace('Auto Update','Updates')}</span></button>`).join('');
  document.querySelectorAll('.m').forEach(b=>b.onclick=()=>{ const id=b.dataset.m, on=!S.modules[id].enabled; S.modules[id].enabled=on; paint(); api?.setSettings({modules:{[id]:{enabled:on}}}); toast(`${MODS.find(m=>m.id===id).name} ${on?'on':'off'}`); }); }
function paint(){ let n=0; for(const m of MODS){ const on=!!S.modules[m.id]?.enabled; if(on) n++; document.querySelector(`.m[data-m="${m.id}"]`)?.classList.toggle('on',on); }
  $('#liveT').textContent=`${n} module${n===1?'':'s'} on`;
  const mv=$('#master'); if(document.activeElement!==mv){ mv.value=S.masterVolume??1; mv.style.setProperty('--p',(S.masterVolume??1)*100+'%'); $('#mout').textContent=Math.round((S.masterVolume??1)*100)+'%'; }
  $('#waves').style.opacity=S.muted?.2:1; $('#mute').style.stroke=S.muted?'#FF5C5C':'';
  $('#qCaf').classList.toggle('on',!!S.modules.caffeine?.enabled); $('#qFocus').classList.toggle('on',!!S.modules.focus?.enabled); $('#qSpot').classList.toggle('on',!!S.modules.spotlight?.enabled); }
async function batt(){ const b=await api?.getBattery(); if(!b) return; $('#pct').textContent=b.level+'%'; $('#status').textContent=b.charged?'Fully charged':b.holding?'Plugged in · charging on hold':b.charging?`Charging${b.remaining?' · '+b.remaining+' to full':''}`:`On battery${b.remaining?' · '+b.remaining+' left':''}`; const hd=document.querySelector('header'); hd.style.setProperty('--lv',Math.max(6,b.level)+'%'); hd.style.setProperty('--tc',b.charging?'var(--a)':b.level<=20?'#FF5C5C':'#6FA8FF'); hd.classList.toggle('chg',!!b.charging&&!b.charged); }
async function state(){ const st=await api?.action('caffeine','state'); $('#qCaf').classList.toggle('live',!!st?.on); $('#qCaf').lastChild.textContent=st?.on?(st.left!=null?`☕ ${st.left}m`:'☕ Awake'):'Caffeine';
  const f=await api?.action('focus','state'); $('#qFocus').classList.toggle('live',!!f&&f.phase!=='idle'); $('#qFocus').lastChild.textContent=f&&f.phase!=='idle'?`${f.mm}:${f.ss}`:'Focus';
  const sp=await api?.action('spotlight','state'); $('#qSpot').classList.toggle('live',!!sp?.on);
  hook=await api?.hookState()||hook; document.querySelectorAll('.m').forEach(b=>{ const m=MODS.find(x=>x.id===b.dataset.m); b.classList.toggle('need',!!(m?.needsHook&&hook!=='running')); }); $('#axT').textContent = hook==='stale' ? 'Keyboard & mouse permission is stuck' : 'Keyboard & mouse need Accessibility'; $('#axBtn').textContent = hook==='stale' ? 'Repair' : 'Allow'; $('#ax').style.display = (hook==='needs-accessibility'||hook==='error'||hook==='stale') && MODS.some(m=>m.needsHook&&S.modules[m.id]?.enabled) ? 'flex' : 'none';
  const u=await api?.action('updater','state'); if(u){ $('#ver').textContent='v'+u.current; const box=$('#upd'); if(['ready','available','downloading','unpacking'].includes(u.status)){ box.style.display='flex'; $('#updT').textContent=u.status==='ready'?`Surge ${u.latest} is ready`:u.status==='downloading'?`Downloading ${u.latest}… ${u.progress||0}%`:u.status==='unpacking'?`Unpacking ${u.latest}…`:`Surge ${u.latest} available`; $('#updBtn').textContent=u.status==='ready'?'Restart':(u.status==='downloading'||u.status==='unpacking')?'…':'Update'; $('#updBtn').disabled=(u.status==='downloading'||u.status==='unpacking'); } else box.style.display='none'; }
  const c=await api?.action('clip','last'); $('#clip').textContent=c?('Clipboard: '+c.replace(/\s+/g,' ').slice(0,28)+(c.length>28?'…':'')):'Clipboard: —'; }
$('#master').oninput=e=>{ e.target.style.setProperty('--p',e.target.value*100+'%'); $('#mout').textContent=Math.round(e.target.value*100)+'%'; S.masterVolume=+e.target.value; clearTimeout(window._mt); window._mt=setTimeout(()=>api?.setSettings({masterVolume:+e.target.value}),120); };
$('#master').onchange=()=>api?.testSound('key',{preset:S.modules.keys?.preset,volume:S.modules.keys?.volume??.6,kind:'key'});
$('#mute').onclick=()=>{ S.muted=!S.muted; api?.setSettings({muted:S.muted}); paint(); toast(S.muted?'Muted':'Sounds on'); };
$('#glowBtn').onclick=()=>api?.preview('preview'); $('#gear').onclick=()=>{ api?.openSettings(); api?.hide(); };
$('#qCaf').onclick=async()=>{ if(!S.modules.caffeine?.enabled){ S.modules.caffeine.enabled=true; await api?.setSettings({modules:{caffeine:{enabled:true}}}); } await api?.action('caffeine','toggle'); state(); };
$('#qFocus').onclick=async()=>{ if(!S.modules.focus?.enabled){ S.modules.focus.enabled=true; await api?.setSettings({modules:{focus:{enabled:true}}}); } const f=await api?.action('focus','state'); await api?.action('focus', f&&f.phase!=='idle'?'stop':'start'); state(); };
$('#qSpot').onclick=async()=>{ if(!S.modules.spotlight?.enabled){ S.modules.spotlight.enabled=true; await api?.setSettings({modules:{spotlight:{enabled:true}}}); } await api?.action('spotlight','toggle'); state(); api?.hide(); };
$('#qNotes').onclick=()=>{ api?.toggleNotes(); api?.hide(); };
$('#quit').onclick=()=>api?.quit();
$('#axBtn').onclick=()=>{ if(hook==='stale'){ toast('Repairing — Surge will restart'); api?.repairAccessibility(); } else api?.openAccessibility(); };
$('#updBtn').onclick=async()=>{ const u=await api?.action('updater','state'); if(u?.status==='ready'){ api?.action('updater','install'); toast('Restarting…'); } else { api?.action('updater','download'); toast('Downloading…'); } };
$('#ver').onclick=async()=>{ toast('Checking…'); const u=await api?.action('updater','check'); toast(u?.status==='available'?`${u.latest} available`:u?.status==='uptodate'?'Up to date':'Check failed'); state(); };
(async()=>{ MODS=await api?.listModules()||[]; S=await api?.getSettings()||S; hook=await api?.hookState()||hook; build(); paint(); batt(); state();
  api?.on('settings:update',s=>{S=s;paint();});
// "why is there no sound?" — one line, one button
const SND={muted:['Unmute',()=>api?.setSettings({muted:false})],volume:['Turn up',()=>api?.setSettings({masterVolume:1})],off:['Turn on',()=>api?.setSettings({modules:{keys:{enabled:true}}})],permission:['Allow',()=>api?.openAccessibility()],stale:['Repair',()=>api?.repairAccessibility()],error:['Settings',()=>api?.openSettings('keys')],modvol:['Fix',()=>api?.setSettings({modules:{keys:{volume:.6}}})]};
async function sndCheck(){ const d=await api?.soundDiag?.(); if(!d) return; const f=SND[d.code]; const ax=$('#ax'); const dup=(d.code==='permission'||d.code==='stale')&&ax&&ax.style.display!=='none';
  $('#chkT').innerHTML=`Keys heard <b style="color:var(--ink)">${d.keyCount}</b> · sounds sent <b style="color:var(--ink)">${d.soundCount}</b> · engine <b style="color:var(--ink)">${(d.audioState||'idle').replace(/^rebuilt.*→ /,'')}</b>${d.code==='waiting'?' · press a key':''}`;
  $('#snd').style.display=f&&!dup?'flex':'none'; if(f){ $('#sndT').textContent='No sound: '+d.text; $('#sndBtn').textContent=f[0]; $('#sndBtn').onclick=async()=>{ await f[1](); setTimeout(sndCheck,400); }; } }
$('#chkBtn').onclick=()=>{ api?.testSound('key',{preset:S.modules?.keys?.preset,volume:.9,kind:'key'}); setTimeout(()=>api?.testSound('key',{preset:S.modules?.keys?.preset,volume:.9,kind:'space'}),160); setTimeout(()=>api?.testSound('bell',{volume:.8}),380); setTimeout(sndCheck,600); };
sndCheck(); setInterval(sndCheck,1000); addEventListener('focus',sndCheck);
// the window grows/shrinks to fit its content — nothing (alerts, footer) may ever be cut off
let lastH=0; function fitH(){ const q=document.querySelector('.quick'), f=document.querySelector('footer'); if(!q||!f) return; const h=Math.min(860,Math.ceil(q.offsetTop+q.offsetHeight+f.offsetHeight+44)); if(Math.abs(h-lastH)>1){ lastH=h; api?.popoverHeight?.(h); } }
new MutationObserver(()=>requestAnimationFrame(fitH)).observe(document.querySelector('.panel'),{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']}); setInterval(fitH,1000); requestAnimationFrame(fitH); function restage(){ document.querySelectorAll('.m').forEach((el,i)=>el.style.setProperty('--i',i)); document.querySelectorAll('.q').forEach((el,i)=>el.style.setProperty('--i',i)); const p=document.querySelector('.panel'); p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); }
api?.on('popover:show',restage); setTimeout(restage,60);
api?.on('popover:edge',e=>document.body.classList.toggle('bottom',e==='bottom')); api?.on('popover:show',()=>{ hook=''; api?.hookState().then(h=>{hook=h;}); batt(); state(); document.querySelector('.panel').style.animation='none'; void document.querySelector('.panel').offsetWidth; document.querySelector('.panel').style.animation=''; });
  setInterval(()=>{ batt(); state(); },2000); })();
addEventListener('keydown',e=>{ if(e.key==='Escape') api?.hide(); });
