<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root{--a:#00FF85;--ink:#f2f2f6;--muted:#9a9aa6;--line:rgba(255,255,255,.1);--spring:cubic-bezier(.34,1.56,.64,1)}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:transparent;font:13px/1.3 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;overflow:hidden}
  .pad{height:100%;border-radius:26px;background:linear-gradient(180deg,rgba(19,24,36,.9),rgba(11,14,21,.92));border:1px solid var(--line);box-shadow:0 40px 100px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);display:flex;flex-direction:column;overflow:hidden;animation:in .28s var(--spring)}
  @keyframes in{from{transform:scale(.94);opacity:0}}
  .top{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;-webkit-app-region:drag}
  .top input{-webkit-app-region:no-drag;flex:1;all:unset;font-size:16px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink);width:100%}
  .top input:focus{border-color:rgba(0,255,133,.5);box-shadow:0 0 0 3px rgba(0,255,133,.12)}
  .top .k{color:var(--muted);font-size:11px;white-space:nowrap}
  .grid{flex:1;overflow:auto;padding:6px 14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;align-content:start}
  .grid::-webkit-scrollbar{width:8px} .grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
  .a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:16px;cursor:pointer;transition:background .15s,transform .25s var(--spring)}
  .a:hover,.a.sel{background:rgba(255,255,255,.09)} .a:active{transform:scale(.94)}
  .a .ic{width:58px;height:58px;border-radius:14px;background:#1e1e26;box-shadow:0 12px 24px -10px rgba(0,0,0,.9);overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:22px;color:#cfcfd8}
  .a .ic img{width:100%;height:100%;display:block}
  .a .n{font-size:11.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .a .n b{color:var(--a);font-weight:700}
  .empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}

  /* fluid max */
  .pad{border:0;border-radius:30px;box-shadow:0 40px 100px -30px rgba(0,0,0,.95),0 0 80px -36px var(--a),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.05);animation:in .95s var(--spring-soft)!important}
  @keyframes in{from{transform:scale(.8) translateY(30px);opacity:0}}
  .top input{border:0;border-radius:16px;transition:box-shadow .4s,transform .7s var(--spring)} .top input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 26%,transparent)}
  .a{border-radius:20px;transition:background .25s,transform .75s var(--spring);animation:aIn .85s var(--spring-soft) backwards;animation-delay:calc(min(var(--i,0),40)*14ms)} @keyframes aIn{from{opacity:0;transform:translateY(30px) scale(.6)}}
  .a:hover,.a.sel{transform:translateY(-6px) scale(1.08);background:rgba(255,255,255,.07)} .a .ic{transition:transform .75s var(--spring),box-shadow .4s} .a:hover .ic,.a.sel .ic{box-shadow:0 20px 30px -12px #000,0 0 30px -10px var(--a)}

  /* balanced pass */
  .a{--c:120,170,255;position:relative} .a::before{content:"";position:absolute;left:50%;top:14px;width:86px;height:70px;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--c),.6),transparent);opacity:0;transition:opacity .4s;pointer-events:none;z-index:0}
  .a:hover::before,.a.sel::before{opacity:1} .a>*{position:relative;z-index:1}
  .a:hover,.a.sel{background:rgba(var(--c),.1)!important;box-shadow:inset 0 0 0 1px rgba(var(--c),.28)}
  .a:hover .ic,.a.sel .ic{box-shadow:0 20px 30px -12px #000,0 0 34px -8px rgb(var(--c))!important}
  kbd{font:inherit;font-size:10.5px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.09);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);color:var(--ink);margin:0 3px 0 8px} #cnt{font-weight:600;color:var(--ink);margin-right:4px}
</style><script>window.FLUID={host:'.pad',blobs:1,magnet:'.none',press:'.a,button',ripple:'.none'}</script><link rel="stylesheet" href="fluid.css"><script defer src="fluid.js"></script><link rel="stylesheet" href="fx.css"><script defer src="fx.js"></script>
</head>
<body><div class="pad">
  <div class="top"><input id="q" placeholder="Search apps…" autofocus><span class="k"><b id="cnt"></b><kbd>↵</kbd> open <kbd>esc</kbd> close</span></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const api=window.surge, $=s=>document.querySelector(s); let ALL=[], shown=[], sel=0; const icons={};
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mark(name,q){ if(!q) return esc(name); const i=name.toLowerCase().indexOf(q.toLowerCase()); return i<0?esc(name):esc(name.slice(0,i))+'<b>'+esc(name.slice(i,i+q.length))+'</b>'+esc(name.slice(i+q.length)); }
function score(a,q){ const n=a.name.toLowerCase(); if(!q) return 1; if(n.startsWith(q)) return 3; if(n.split(/\s+/).some(w=>w.startsWith(q))) return 2; if(n.includes(q)) return 1; return 0; }
function render(){ const q=$('#q').value.trim().toLowerCase(); shown=ALL.map(a=>[score(a,q),a]).filter(x=>x[0]>0).sort((x,y)=>y[0]-x[0]||x[1].name.localeCompare(y[1].name)).map(x=>x[1]); sel=0;
  const g=$('#grid'); g.innerHTML=shown.length?shown.map((a,i)=>`<div class="a ${i===0&&q?'sel':''}" data-i="${i}" style="--i:${i}"><div class="ic" data-p="${esc(a.path)}">${icons[a.path]?`<img src="${icons[a.path]}">`:esc(a.name[0].toUpperCase())}</div><div class="n">${mark(a.name,q)}</div></div>`).join(''):'<div class="empty">No apps match</div>';
  g.querySelectorAll('.a').forEach(el=>el.onclick=()=>open(shown[+el.dataset.i]));
  g.querySelectorAll('.a').forEach(el=>{ const p=el.querySelector('.ic').dataset.p; if(colCache[p]) el.style.setProperty('--c',colCache[p]); else if(icons[p]) tint(p,icons[p],el); });
  const k=document.getElementById('cnt'); if(k) k.textContent=shown.length+(shown.length===1?' app':' apps');
  lazyIcons(); }
const colCache={};
function tint(path, src, tile){ if(colCache[path]){ tile.style.setProperty('--c',colCache[path]); return; } const im=new Image(); im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=c.height=24; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(im,0,0,24,24); const d=x.getImageData(0,0,24,24).data; let r=0,g=0,b=0,w=0;
  for(let i=0;i<d.length;i+=4){ const a=d[i+3]/255; if(a<.5) continue; const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]); const sat=mx?(mx-mn)/mx:0; const k=a*(sat*sat+.02)*(mx/255); r+=d[i]*k; g+=d[i+1]*k; b+=d[i+2]*k; w+=k; }
  if(w<.01) return; r/=w; g/=w; b/=w; const f=Math.min(2.2,235/Math.max(r,g,b,1)); colCache[path]=[r*f,g*f,b*f].map(v=>Math.round(Math.min(255,v))).join(','); if(tile.isConnected) tile.style.setProperty('--c',colCache[path]); }catch{} }; im.src=src; }
let io=null;
function lazyIcons(){ io&&io.disconnect(); io=new IntersectionObserver(es=>{ for(const e of es){ if(!e.isIntersecting) continue; const d=e.target; const p=d.dataset.p; io.unobserve(d); if(icons[p]) continue; api?.appIcon(p).then(s=>{ if(s){ icons[p]=s; d.innerHTML=`<img src="${s}">`; tint(p,s,d.parentElement); } }); } },{root:$('#grid'),rootMargin:'200px'}); document.querySelectorAll('.ic').forEach(d=>io.observe(d)); }
function open(a){ if(!a) return; api?.appOpen(a.path); api?.hide(); }
$('#q').oninput=render;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ api?.hide(); return; } if(e.key==='Enter'){ open(shown[sel]); return; }
  const cols=Math.max(1,Math.floor(($('#grid').clientWidth-28)/108)); let n=sel; if(e.key==='ArrowRight') n++; else if(e.key==='ArrowLeft') n--; else if(e.key==='ArrowDown') n+=cols; else if(e.key==='ArrowUp') n-=cols; else return; e.preventDefault();
  sel=Math.max(0,Math.min(shown.length-1,n)); document.querySelectorAll('.a').forEach((el,i)=>el.classList.toggle('sel',i===sel)); document.querySelector('.a.sel')?.scrollIntoView({block:'nearest'}); });
addEventListener('focus',()=>{ $('#q').value=''; render(); $('#q').focus(); });
(async()=>{ ALL=await api?.appsInstalled()||[]; render(); $('#q').focus(); })();
</script></body></html>
