<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="nova.css"><style>
  html,body{height:100%;overflow:hidden}
  body{padding:8px}
  .pad{height:100%;display:flex;flex-direction:column;border-radius:30px;overflow:hidden;isolation:isolate;position:relative;animation:nv-pop .55s var(--jelly) both;
    background:radial-gradient(70% 40% at 0% 0%,rgba(123,61,255,.22),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(255,46,138,.16),transparent 70%),linear-gradient(180deg,rgba(21,16,41,.97),rgba(8,6,15,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.08),0 26px 60px -24px rgba(0,0,0,.95)}
  .hero{margin:10px 10px 0;padding:16px 18px;border-radius:24px}
  .hero .tile{--ts:48px}
  .hero h1{font-size:28px}
  .top{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
  #q{all:unset;flex:1;height:40px;padding:0 15px;border-radius:14px;font:650 14.5px/1 var(--body);background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 3px rgba(0,0,0,.45);-webkit-user-select:text}
  #q:focus{box-shadow:inset 0 0 0 1px rgba(123,61,255,.8),0 0 0 4px rgba(123,61,255,.2)}
  #q::placeholder{color:var(--mut)}
  .k{display:flex;align-items:center;gap:5px;font:650 11px/1 var(--body);color:var(--mut);white-space:nowrap}
  .k b{font:800 12px/1 var(--head);color:var(--tx2);margin-right:6px}
  kbd{font:700 10.5px/1 var(--body);min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-grid;place-items:center;color:var(--tx2);background:rgba(255,255,255,.08);box-shadow:inset 0 -1px 0 rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.08)}
  .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));align-content:start;gap:6px;padding:8px 14px 18px}
  .a{--c:180,160,255;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:20px;cursor:pointer;transition:transform .5s var(--jelly);animation:nv-in .55s var(--jelly-soft) both;animation-delay:calc(min(var(--i,0),30)*14ms)}
  .a:hover,.a.sel{background:radial-gradient(90% 90% at 50% 20%,rgba(var(--c),.3),transparent 75%),rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(var(--c),.4)}
  .a:hover{transform:translateY(-2px)}.a:active{transform:scale(.94)}
  .ic{width:58px;height:58px;display:grid;place-items:center;font:800 24px/1 var(--head);border-radius:16px}
  .ic img{width:58px;height:58px;filter:drop-shadow(0 8px 12px rgba(var(--c),.35))}
  .ic:not(:has(img)){background:linear-gradient(150deg,var(--violet),var(--pink));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .n{font:700 11.5px/1.2 var(--head);letter-spacing:-.01em;text-align:center;color:var(--tx2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .n b{color:#fff;background:rgba(123,61,255,.4);border-radius:4px}
  .empty{grid-column:1/-1;padding:50px;text-align:center;font:700 14px/1 var(--head);color:var(--mut)}
</style><script src="nova.js"></script>
</head>
<body><div class="pad h-violet">
  <div class="hero h-violet drag"><div class="wm"></div><div class="tile"></div><div class="htx"><span class="eyebrow">Surge Dock</span><h1>Launchpad</h1></div></div>
  <div class="top"><input id="q" placeholder="Search apps" autofocus><span class="k"><b id="cnt"></b><kbd>↩︎</kbd> open <kbd>esc</kbd> close</span></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const api=window.surge, $=s=>document.querySelector(s); $('.hero .tile').innerHTML=Nova.ic('apps'); $('.hero .wm').innerHTML=Nova.ic('apps'); let ALL=[], shown=[], sel=0; const icons={};
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mark(name,q){ if(!q) return esc(name); const i=name.toLowerCase().indexOf(q.toLowerCase()); return i<0?esc(name):esc(name.slice(0,i))+'<b>'+esc(name.slice(i,i+q.length))+'</b>'+esc(name.slice(i+q.length)); }
function score(a,q){ const n=a.name.toLowerCase(); if(!q) return 1; if(n.startsWith(q)) return 3; if(n.split(/\s+/).some(w=>w.startsWith(q))) return 2; if(n.includes(q)) return 1; return 0; }
function render(){ const q=$('#q').value.trim().toLowerCase(); shown=ALL.map(a=>[score(a,q),a]).filter(x=>x[0]>0).sort((x,y)=>y[0]-x[0]||x[1].name.localeCompare(y[1].name)).map(x=>x[1]); sel=0;
  const g=$('#grid'); g.innerHTML=shown.length?shown.map((a,i)=>`<div class="a ${i===0&&q?'sel':''}" data-i="${i}" style="--i:${i}"><div class="ic" data-p="${esc(a.path)}">${icons[a.path]?`<img src="${icons[a.path]}">`:esc(a.name[0].toUpperCase())}</div><div class="n">${mark(a.name,q)}</div></div>`).join(''):'<div class="empty">No apps match</div>';
  g.querySelectorAll('.a').forEach(el=>el.onclick=()=>open(shown[+el.dataset.i]));
  g.querySelectorAll('.a').forEach(el=>{ const p=el.querySelector('.ic').dataset.p; if(colCache[p]) el.style.setProperty('--c',colCache[p]); else if(icons[p]) tint(p,icons[p],el); });
  const k=document.getElementById('cnt'); if(k) k.textContent=shown.length+(shown.length===1?' app':' apps');
  lazyIcons(); }
const colCache={};
function tint(path, src, tile){ if(colCache[path]){ tile.style.setProperty('--c',colCache[path]); return; } const im=new Image(); im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=c.height=24; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(im,0,0,24,24); const d=x.getImageData(0,0,24,24).data; let r=0,g=0,b=0,w=0;
  for(let i=0;i<d.length;i+=4){ const a=d[i+3]/255; if(a<.5) continue; const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]); const sat=mx?(mx-mn)/mx:0; const k=a*(sat*sat+.02)*(mx/255); r+=d[i]*k; g+=d[i+1]*k; b+=d[i+2]*k; w+=k; }
  if(w<.01) return; r/=w; g/=w; b/=w; const f=Math.min(2.2,235/Math.max(r,g,b,1)); colCache[path]=[r*f,g*f,b*f].map(v=>Math.round(Math.min(255,v))).join(','); if(tile.isConnected) tile.style.setProperty('--c',colCache[path]); }catch{} }; im.src=src; }
let io=null;
function lazyIcons(){ io&&io.disconnect(); io=new IntersectionObserver(es=>{ for(const e of es){ if(!e.isIntersecting) continue; const d=e.target; const p=d.dataset.p; io.unobserve(d); if(icons[p]) continue; api?.appIcon(p).then(s=>{ if(s){ icons[p]=s; d.innerHTML=`<img src="${s}">`; tint(p,s,d.parentElement); } }); } },{root:$('#grid'),rootMargin:'200px'}); document.querySelectorAll('.ic').forEach(d=>io.observe(d)); }
function open(a){ if(!a) return; api?.appOpen(a.path); api?.hide(); }
$('#q').oninput=render;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ api?.hide(); return; } if(e.key==='Enter'){ open(shown[sel]); return; }
  const cols=Math.max(1,Math.floor(($('#grid').clientWidth-28)/108)); let n=sel; if(e.key==='ArrowRight') n++; else if(e.key==='ArrowLeft') n--; else if(e.key==='ArrowDown') n+=cols; else if(e.key==='ArrowUp') n-=cols; else return; e.preventDefault();
  sel=Math.max(0,Math.min(shown.length-1,n)); document.querySelectorAll('.a').forEach((el,i)=>el.classList.toggle('sel',i===sel)); document.querySelector('.a.sel')?.scrollIntoView({block:'nearest'}); });
addEventListener('focus',()=>{ $('#q').value=''; render(); $('#q').focus(); });
(async()=>{ ALL=await api?.appsInstalled()||[]; render(); $('#q').focus(); })();
</script></body></html>
